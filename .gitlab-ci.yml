# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
#
# Pipeline for s3mail (Go).
#
# Every job runs untagged and therefore lands on `aws-spot-runner`, the only
# runner in this project that accepts untagged jobs (Docker, Linux/arm64). The
# others demand their own tags and are reserved for signing and apk work.
#
# That the runner is arm64 does not matter: Go cross-compiles from there for
# every target, because nothing in the dependency chain needs CGO. That is
# exactly why this project moved from Python to Go - PyInstaller could only ever
# build for the platform it ran on, which made a Windows package impossible.
#
# The catalogue under devops/ci-cd-components used to be PHP/TYPO3 only, with
# nothing for Go, so this pipeline was written by hand. That gap is closed:
# composed-default-pipelines/go exists now, and this repository is why. What
# remains written out below is only what this repository actually ships.

include:
  # Cutting the tag is a mechanism, not a memory. Before this, nothing here
  # created one: the release jobs below are gated on $CI_COMMIT_TAG and somebody
  # had to push that tag by hand. On 2026-08-31 that had left 25 commits
  # unreleased since v1.3.2 - among them three `feat:`, a CloudFormation
  # template and the demo mailbox, waiting three days without anybody deciding
  # they should wait. Exactly the shape of gap that also kept ios unbuilt.
  #
  # release-tools/yasrt cuts the release on the main pipeline: `version`
  # decides in .pre, the builds run, `release` tags and publishes the GitLab
  # release in the release stage -- with the job token, which starts no
  # pipeline. Signing, manifest, upload and links stay on the TAG pipeline,
  # because the code-signing role's OIDC trust is scoped to ref_type:tag
  # (koh-infra gitlab/code-signing.tf, deliberately); tag-pipeline therefore
  # has the release trigger this project on the tag it just cut, and those
  # jobs run exactly as they did when the tag pipeline came from a push.
  #
  # tag-format, because the shared defaults tag a bare `${version}` while this
  # repository has always used v-prefixed tags - and the release jobs match on
  # /^v[0-9]+\.[0-9]+\.[0-9]+$/.
  #
  # Only on a push to a protected branch without a tag: the tag pipeline is a
  # triggered one and must not decide anything, and a pipeline started by
  # hand may still force a run.
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/release-tools/yasrt@2
    inputs:
      stage-version: .pre
      stage-release: release
      product: custom
      tag-format: 'v${version}'
      tag-pipeline: 'true'
      # The note on every merge request and closed issue of a release, as
      # release:semver's success step left it.
      mr-comments: 'true'
      rules-config:
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "web"
        # And api, for the same reason: a run started with `glab ci run` is a
        # run started by hand. A withdrawn release (the tag pipeline failed
        # on a transient AWS error, 2026-09-15) is cut again by such a run.
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "api"
        - if: $CI_COMMIT_REF_PROTECTED == "true" && $CI_COMMIT_TAG == null && $CI_PIPELINE_SOURCE == "push"
        - when: never
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/composed-default-pipelines/go@2.14.8
    inputs:
      working-directory: .
      # No `test-args`: test:go is overridden below to keep this repository's
      # coverage reporting, and that override replaces the script anyway.
      # Declaring the arguments here as well would leave two places claiming to
      # decide how the tests run.

  # Signing the manifest comes from the estate, not from hand-written steps.
  # devops/ci-cd-components/build-provenance/sign-artifact does exactly this: a
  # detached cosign signature over one file, key in KMS, role over OIDC, and it
  # verifies its own signature before leaving the job. A second route to the same
  # key would be a second way to use it wrongly.
  #
  # A full tag rather than ~latest or @2: build-provenance is not a catalogue
  # project, and GitLab only resolves a complete tag there. Renovate keeps it up.
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/build-provenance
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/build-provenance/sign-artifact@2.0.157
    inputs:
      stage: release
      artifact-file: SHA256SUMS
      needs-config:
        - job: manifest
      # Must match manifest's own rule. The component's default also creates the
      # job on the default branch, where there is no manifest - and a `needs` on
      # a job the pipeline does not contain is a configuration error: the
      # pipeline comes into being with no jobs at all and counts as failed. That
      # happened three times after a merge before this was pinned down.
      rules-config:
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

  # The public mirror and the GitHub release, from the estate's component
  # rather than a copy of the job: yasrt, pinup and this repository each had
  # one, and the copies drifted.
  #
  # mirror:github rewrites the history without CLAUDE.md, .claude/ and
  # .gitlab/ (git filter-repo, deterministic, so the ids on GitHub stay put),
  # keeps main and the v-tags, and force-pushes with --prune. It runs in two
  # pipelines: on a push to main, after the release stage, so the tag yasrt
  # has just cut is mirrored in the same pipeline; and on the tag pipeline,
  # before release:github, because a release needs its tag on GitHub first.
  # Both push the same rewritten history.
  #
  # release:github hangs onto the GitHub release the very files release:links
  # links here: the packages, the per-package checksums, SHA256SUMS and its
  # signature. Nothing is built twice - a macOS package built on GitHub would
  # be an unsigned one under the same name.
  #
  # GITHUB_MIRROR_TOKEN is a fine-grained token with contents:write on the
  # mirror repository, the one stored secret about publishing this project.
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/extension-clean-export
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-mirror@1.4.2
    inputs:
      stage: .post
      mirror-target: 'ohartwig/s3mail'
      mirror-token-var: 'GITHUB_MIRROR_TOKEN'
      strip-paths: ['CLAUDE.md', '.claude', '.gitlab']
      keep-tags: 'v*'
      prune: 'true'
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        # push, and web: a run started by hand on main mirrors too - the
        # first fill of the repository on GitHub was exactly that.
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api")
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/extension-clean-export
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/extension-clean-export/github-release@1.4.2
    inputs:
      stage: .post
      release-target: 'ohartwig/s3mail'
      release-token-var: 'GITHUB_MIRROR_TOKEN'
      assets: ['dist/*.zip', 'dist/*.sha256', 'SHA256SUMS', 'SHA256SUMS.sig']
      # The same install paragraph release:footer appends here.
      notes-footer-file: '.gitlab/release-footer.md'
      needs-config:
        - mirror:github
        # The same producers as upload: the packages from the build jobs and
        # sign:macos, the manifest, and its signature where the component
        # made one.
        - build:linux-amd64
        - build:windows-amd64
        - sign:macos
        - manifest
        - job: sign:artifact:SHA256SUMS
          optional: true
      rules-config:
        - if: $GITHUB_MIRROR_TOKEN == null
          when: never
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/


# MUST stay a superset of the composed template's stages. A consumer's list
# REPLACES the composed one, so `quick` and `test` are not decoration here --
# they belong to go@1.60.1, and `build` and `release` are this repository's own.
#
# The trap is that adding a stage to the template is a change over there that
# breaks the pipeline over here, and it breaks it in the worst way: no YAML
# error, no jobs, and a pipeline that counts as failed the instant it is
# requested ("chosen stage X does not exist"). The estate has been bitten by
# exactly this three times, which is why every template repeats the warning.
#
# So: when the pin above moves, read the template's `stages:` before merging.
# Nothing checks this automatically.
stages:
  - quick     # from the go template
  - test      # from the go template
  - build     # ours
  - release   # ours


variables:
  # GO_IMAGE from our own golden image (devops/images/golang), no longer from
  # the Minimus mirror: Minimus shuts down on 2026-10-22, and Go is a Wolfi
  # package maintained in its own right - no detour through a third mirror
  # needed. Internal-visible devops/images/* projects are pullable estate-wide
  # without an allowlist entry; the job-token allowlist now only covers
  # CURL_IMAGE from devops/ci-mirrors.
  #
  # Stayed on 1.27 rather than falling back to 1.25: the image repository builds
  # on go-1.27 deliberately, because this project already moved from 1.25 to
  # 1.27 once (commit 3f87e3d, 2026-08-23). That is a decision already taken,
  # which this continues rather than reverses. `:1.27` is the rolling tag
  # carrying the real Go version, not the image repository's own release count
  # (which sits beside it as an immutable tag).
  GO_IMAGE: "registry.ole-hartwig.eu/devops/images/golang:1.27"
  # CURL_IMAGE likewise from our own golden image (devops/images/curl) rather
  # than the Minimus mirror - same reasoning as GO_IMAGE. `:8.21` is the rolling
  # tag carrying the real curl version.
  CURL_IMAGE: "registry.ole-hartwig.eu/devops/images/curl:8.21"
  # Do not quietly pull a different Go version: what is in the image is what
  # counts.
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/s3mail"

default:
  image: ${GO_IMAGE}
  # The fleet is spot instances: one can be reclaimed mid-job, and the job then
  # dies with "instance no longer running". That is not a fault in what was
  # built - on the first v0.2.1 run it hit two of four build jobs while the
  # other two passed on the same commit.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
      # Not stuck_or_timeout_failure: deprecated, and /ci/lint says so. It was
      # split into the more specific reasons, of which this is the one that
      # means the runner lost its dependency rather than the job failing.
      - runner_external_dependency_failure
      # A failed image pull lands here, and in this repository it is the single
      # most common way a job dies: 48 of the last 100 failed jobs, ahead of
      # script_failure (22). Across five different images - ci-tools,
      # franken-php, code-signing, golang - which is what says it is the pull
      # path and not a wrong name anywhere.
      #
      # The reason reads like a configuration mistake, and sometimes it is one.
      # It was one here, in part: this project was missing from the CI/CD
      # job-token allowlist of devops/images/ci-tools and
      # devops/images/franken-php/ci, while it was present on those of
      # devops/images/golang and devops/images/code-signing. The three jobs
      # pulling the first two account for 33 of the 48 failures. Both entries
      # were added on 2026-09-01; whether the rate drops is the measurement
      # that decides how much of this was configuration and how much was the
      # registry.
      #
      # Retrying does not hide such a cause. A wrong image reference or a
      # missing permission fails all three attempts in seconds, at the pull,
      # and is as visible in the job log afterwards as before - the job is
      # still red, only later. What changes is the case where a person had to
      # press retry on a registry that had already recovered: four times on
      # 2026-08-31 alone, once on a pipeline that was cutting a release.
      - runner_configuration_error

# --------------------------------------------------------------------------- #
# Test
# --------------------------------------------------------------------------- #
# gofmt and vet now come from the template as lint:gofmt and lint:vet. What the
# template does not carry is the coverage reporting, so test:go is extended
# rather than replaced: image, cache, stage and the working directory stay as
# the component defines them, and only the parts below are added.
test:go:
  script:
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - coverage.out
    expire_in: 1 week

# --------------------------------------------------------------------------- #
# Building - four platforms from one run
# --------------------------------------------------------------------------- #
.build:
  stage: build
  needs: [test:go]
  # The module cache sits here, not in `default:`: in `default:` it reached
  # the composed jobs as well, which do not build.
  cache:
    key:
      files:
        - go.sum
    paths:
      - .go/pkg/mod
  script:
    # -trimpath takes the build machine's paths out of the binary, so two runs
    # produce the same result.
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - mkdir -p dist
    # On Windows LDFLAGS also carries -H windowsgui: without it a double-click
    # tears open a console window, and closing that window kills the server.
    - |
      CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
        go build -trimpath -ldflags="-s -w -X main.version=${VERSION} ${EXTRA_LDFLAGS:-}" \
        -o "dist/${BINARY}" ./cmd/s3mail
    # macOS gets an app bundle rather than a bare Unix file. A bundle is only a
    # directory structure with an Info.plist - that can be produced on Linux
    # too, with no Apple tooling and without the Mac the port got rid of.
    # macOS stops here: the bundle goes to sign:macos as an artefact, and only
    # after signing is it zipped. The other way round the zip would have to be
    # opened again, and stapling applies to the bundle anyway, not the archive.
    - |
      if [ "$TARGET_OS" = "darwin" ]; then
        # CFBundleVersion only tolerates digits and dots. What arrives here as
        # VERSION is a tag like v0.9.0 or v0.9.0-rc1, and on branch runs even a
        # short commit id. So: trim it - leading v off, pre-release suffix off,
        # and whatever is still not a version number becomes 0.0.0. The full tag
        # is untouched by this; it sits in the program via -X main.version and
        # is what the user actually sees.
        PLIST_VERSION=$(printf '%s' "${VERSION}" | sed 's/^v//; s/[-+].*$//')
        case "$PLIST_VERSION" in
          ''|*[!0-9.]*) PLIST_VERSION=0.0.0 ;;
        esac
        tools/bundle/build.sh "dist/${BINARY}" dist "${PLIST_VERSION}"
        rm "dist/${BINARY}"
        mv dist/s3mail.app "dist/s3mail-${LABEL}.app"
        exit 0
      fi
      go run tools/zip.go "dist/s3mail-${LABEL}.zip" "dist/${BINARY}"
      rm -rf "dist/${BINARY}"
    # A zip, so the execute bit and the bundle structure survive the download -
    # a file fetched raw arrives without +x and does not start. Packed with Go
    # rather than /usr/bin/zip: the golang image does not carry it, and an
    # apt-get for that would be a second package channel in a pipeline that
    # otherwise needs only Go.
    - cd dist && sha256sum "s3mail-${LABEL}.zip" > "s3mail-${LABEL}.zip.sha256"
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

build:windows-amd64:
  extends: .build
  variables: { TARGET_OS: windows, TARGET_ARCH: amd64, LABEL: windows-amd64, BINARY: s3mail.exe,
               EXTRA_LDFLAGS: "-H windowsgui" }

build:macos-arm64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: arm64, LABEL: macos-arm64, BINARY: s3mail }

build:macos-amd64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: amd64, LABEL: macos-amd64, BINARY: s3mail }

build:linux-amd64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: amd64, LABEL: linux-amd64, BINARY: s3mail }

# --------------------------------------------------------------------------- #
# Signing - macOS only
#
# Without a signature Gatekeeper *blocks* the program on first start, and the
# only way out is `xattr -dr com.apple.quarantine`. That is the hurdle where
# somebody who did not build s3mail themselves gives up.
#
# The job runs on `az1a`, and that is not cosmetic: the general fleet is
# IPv6-only, and Apple's notary and timestamp services are not reliably
# reachable from there. Without the tag, notarisation fails on something that
# looks like a network error and is not one.
#
# On a tag it signs with the real Developer ID certificate and notarises with
# Apple. On every other run it uses a throwaway certificate and no notarisation
# - Gatekeeper rejects the result, but the mechanism has been exercised.
# Otherwise a broken signing step would only surface when a release is due, and
# then it is expensive.
#
# That the boundary is the tag and not the branch is not only written here: the
# trust policy of the gitlab-ci-code-signing-role allows
# AssumeRoleWithWebIdentity only for sub=...ref_type:tag:ref:v*. A branch run
# therefore never reaches the secrets at all - it dies on the first
# GetSecretValue with UnrecognizedClientException, which looks like a broken
# credential and is not one: it is the role assumption before it that does not
# happen. Opening the switch here would mean opening the policy too, and the
# certificate would then be reachable from every branch.
#
# For a rehearsal with real material there is the pre-release tag: a v0.9.0-rc1
# is signed and notarised exactly like a release but publishes none. upload and
# release demand a tag of the form vX.Y.Z, see below.
# --------------------------------------------------------------------------- #
sign:macos:
  stage: build
  # The golden image carries rcodesign, the AWS CLI, openssl and zip. The one
  # job in the estate that touches private signing material installs nothing
  # while it runs and downloads nothing from the network - before, that was an
  # `apk add` and a download from github.
  # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/images/code-signing
  image: registry.ole-hartwig.eu/devops/images/code-signing:1.3.20@sha256:4a075cdeb0f30b21068d921a88cb9a2ce61f15b18ba5cd070e8a391cc138fcae
  tags: [az1a]
  needs:
    - build:macos-arm64
    - build:macos-amd64
  before_script: []
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.ole-hartwig.eu
  # NO variable in this job may start with RCODESIGN_. rcodesign reads its
  # configuration from environment variables with exactly that prefix; the rest
  # of the name becomes a configuration key, and it rejects unknown keys. An
  # RCODESIGN_VERSION - which stood here once - kills every invocation before it
  # does any work:
  #   configuration file error / problem key: version
  #   problem: UnknownField("version", ["sign", "remote-sign"])
  # `rcodesign --version` still answers while this happens, which drags the
  # search out.
  variables:
    AWS_DEFAULT_REGION: eu-north-1
    AWS_ROLE_ARN: arn:aws:iam::714476370938:role/gitlab-ci-code-signing-role
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab_oidc_token
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab_oidc_token
    # Clear static keys away before the CLI sees them.
    #
    # From somewhere - not this project and not the development group -
    # AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY are present in the job
    # environment. In the AWS CLI's chain the environment comes before assuming
    # a role over OIDC: with keys set, AWS_ROLE_ARN and the token are never
    # looked at. The keys are worthless (sts get-caller-identity answers
    # InvalidClientTokenId), so the job died on the first GetSecretValue with
    # UnrecognizedClientException - a message that sounds like a broken secret
    # and has nothing to do with one.
    #
    # Gone, here. This job is to work solely with the role the tag grants it;
    # anything else would be a second route to the same signing material.
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    # Real material on a tag, a throwaway certificate otherwise.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Records in the log who the job is working as. Only inside here, not
        # before: on a branch there is no role to assume - the trust policy
        # allows tags only - and AWS then refuses, entirely correctly. A check
        # that kills the job would be a poor check.
        aws sts get-caller-identity
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-developer-id-p12 \
          --query SecretString --output text | base64 -d > /tmp/id.p12
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-developer-id-password \
          --query SecretString --output text > /tmp/id.pw
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-notary-api-key \
          --query SecretString --output text > /tmp/notary.json
        REAL=yes
      else
        # openssl rather than `rcodesign generate-self-signed-certificate`, and
        # deliberately so: the same openssl line has to produce the real
        # Developer ID container too, so what is exercised here is the path that
        # matters. A self-made certificate is no good for --for-notarization
        # anyway - that demands a real Developer ID.
        openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
          -keyout /tmp/wegwerf.key -out /tmp/wegwerf.crt \
          -subj "/CN=s3mail CI Wegwerf/C=DE" 2>/dev/null
        # The three switches are not decoration: rcodesign reads PKCS#12 through
        # the `p12` crate, which knows the old container with SHA1/3DES and not
        # what OpenSSL 3 writes by default (PBES2 with AES-256-CBC). `-legacy`
        # would do the same but demands the legacy provider in the image; 3DES
        # sits in the default provider and does not need it.
        openssl pkcs12 -export -inkey /tmp/wegwerf.key -in /tmp/wegwerf.crt \
          -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
          -out /tmp/id.p12 -passout pass:wegwerf
        printf 'wegwerf' > /tmp/id.pw
        REAL=no
      fi
    # An absolute path rather than `cd dist`: GitLab runs every script line
    # in the same shell, so a second relative cd lands in dist/dist.
    - |
      cd "$CI_PROJECT_DIR/dist"
      for LABEL in macos-arm64 macos-amd64; do
        APP="s3mail-${LABEL}.app"
        if [ "$REAL" = "yes" ]; then
          # --for-notarization does three things at once: demands a real
          # Developer ID certificate, forces the timestamp, and sets the
          # hardened runtime - without which Apple refuses to notarise.
          rcodesign sign --p12-file /tmp/id.p12 --p12-password-file /tmp/id.pw \
            --for-notarization "$APP"
          rcodesign notary-submit --api-key-file /tmp/notary.json --staple "$APP"
        else
          # A self-made certificate is not a Developer ID, so
          # --for-notarization is out. The hardened runtime is set anyway, so
          # the same structure comes out as in the real case.
          rcodesign sign --p12-file /tmp/id.p12 --p12-password-file /tmp/id.pw \
            --code-signature-flags runtime "$APP"
        fi
        # Zipped here with `zip` and not with tools/zip.go: the signing image
        # carries no Go, and installing a toolchain for it would be exactly what
        # the image was built against. That leaves two zippers in the project -
        # which is why the step below checks the property that actually matters
        # instead of trusting the tool.
        mv "$APP" s3mail.app
        zip -q -r -y "s3mail-${LABEL}.zip" s3mail.app
        rm -rf s3mail.app
        sha256sum "s3mail-${LABEL}.zip" > "s3mail-${LABEL}.zip.sha256"
      done
    # A package whose execute bit does not survive the journey will not start
    # on the target machine - and that is only noticed there. So check here.
    - |
      cd "$CI_PROJECT_DIR/dist"
      for LABEL in macos-arm64 macos-amd64; do
        rm -rf pruef && mkdir pruef && unzip -q "s3mail-${LABEL}.zip" -d pruef
        BIN=pruef/s3mail.app/Contents/MacOS/s3mail
        test -x "$BIN" || { echo "FEHLER: $LABEL - Ausfuehrungsbit verloren"; exit 1; }
        test -f pruef/s3mail.app/Contents/Info.plist || { echo "FEHLER: $LABEL - Info.plist fehlt"; exit 1; }
        test -d pruef/s3mail.app/Contents/_CodeSignature || { echo "FEHLER: $LABEL - keine Signatur im Bundle"; exit 1; }
        echo "$LABEL: Bundle vollstaendig, ausfuehrbar, signiert"
        rm -rf pruef
      done
    - rm -f /tmp/id.p12 /tmp/id.pw /tmp/notary.json /tmp/wegwerf.key /tmp/wegwerf.crt
  artifacts:
    paths:
      - dist/
    expire_in: 1 month

# --------------------------------------------------------------------------- #
# One manifest over all packages, so that what was downloaded can be checked
#
# Every package already has a .sha256 beside it. That answers "did the file
# arrive intact" and not "does it come from us": whoever swaps the package swaps
# the checksum beside it too. Only the signature over the manifest turns the
# checksum into a statement - and one about all four packages at once.
#
# macOS is notarised on top of that; the manifest is the route for Windows and
# Linux, where there is no signature inside the package.
# --------------------------------------------------------------------------- #
manifest:
  stage: release
  image: ${GO_IMAGE}
  before_script: []
  needs:
    - build:linux-amd64
    - build:windows-amd64
    - sign:macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # Sorted, so two runs of the same state produce the same manifest.
    - cd dist && sha256sum *.zip | sort -k2 > "$CI_PROJECT_DIR/SHA256SUMS"
    - cat "$CI_PROJECT_DIR/SHA256SUMS"
  artifacts:
    paths:
      - SHA256SUMS
    expire_in: 1 month

upload:
  stage: release
  image: ${CURL_IMAGE}
  before_script: []
  # Named explicitly, so the macOS packages come from sign:macos and not from
  # the build jobs: since signing was added, those only produce the bare bundle.
  needs:
    - build:linux-amd64
    - build:windows-amd64
    - sign:macos
    - manifest
    # The component's job name is sign:artifact:<file> and not sign-artifact.
    # With the wrong name GitLab does not pull the artefact, the job still runs
    # green, and the release page ends up linking a signature that is nowhere.
    # It stays optional because the component only creates the job where signing
    # is possible at all.
    - job: sign:artifact:SHA256SUMS
      optional: true
  # Publish only complete version tags. A pre-release tag such as v0.9.0-rc1
  # therefore goes through building and signing in full - with the real
  # certificate, since IAM allows any v* - but stores no package and creates no
  # release. That is how the signing path gets exercised without anybody being
  # able to download the result.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # The package version is the tag as it stands - the same string that appears
    # in the asset links below. Stripping the "v" here would have produced links
    # pointing nowhere.
    #
    # Manifest and signature live in the project directory, not in dist: they
    # belong to the release and not to a build target.
    #
    # The manifest MUST be there; if it is missing something is fundamentally
    # wrong, and the job should say so instead of quietly building a release
    # with no checksums.
    - cp "$CI_PROJECT_DIR/SHA256SUMS" dist/
    # The signature may be absent - the component only creates its job where
    # signing is possible. Whether it was there decides below whether the
    # release page gets a link to it: a link to a signature that is nowhere is
    # worse than no link. That is exactly what happened at v1.0.0.
    - |
      if cp "$CI_PROJECT_DIR/SHA256SUMS.sig" dist/ 2>/dev/null; then
        echo "SIGNED=yes" > "$CI_PROJECT_DIR/release.env"
      else
        echo "SIGNED=no" > "$CI_PROJECT_DIR/release.env"
        echo "note: no signature for the manifest - the release links none"
      fi
    - cd dist
    - |
      for f in *.zip *.sha256 SHA256SUMS SHA256SUMS.sig; do
        [ -f "$f" ] || continue
        echo "uploading: $f"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/${CI_COMMIT_TAG}/${f}"
        echo
      done
  artifacts:
    reports:
      # Tells the release job whether there is a signature to link.
      dotenv: release.env

release:links:
  stage: release
  # No release-cli: its image sits in registry.gitlab.com and the runners cannot
  # reach that host - they are IPv6-only, the registry is IPv4-only.
  # devops/ci-mirrors exists for exactly this, but mirroring another image there
  # would be the detour: the releases API does the same thing, and curl is
  # already here.
  image: ${CURL_IMAGE}
  before_script: []
  needs: [upload]
  # The same barrier as upload: pre-release tags produce no release.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # The release page already exists: yasrt created it when it cut the tag,
    # with the generated changelog as its description (release:footer adds the
    # install notes afterwards). What is missing at that moment are the packages,
    # because they are built by the tag pipeline this job belongs to - so this
    # job adds the links and nothing else.
    #
    # It used to POST the whole release. That now returns 409, and hiding the
    # conflict would be worse than the duplicate: two paths writing one release
    # page is how v1.0.0 ended up linking a signature that was nowhere.
    #
    # Form-encoded, one call per link, and still no JSON assembled by hand. The
    # curl image carries curl and ca-certificates and nothing else - no jq -
    # which is the same constraint that shaped the old job.
    - |
      # Idempotent: a link that is already there is left alone. A tag
      # pipeline run a second time - to publish on GitHub after the token
      # arrived, 2026-09-15 - otherwise fails here with "Name has already
      # been taken", and the .post jobs behind it never run.
      existing="$(curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links")"
      link() {
        if printf '%s' "$existing" | grep -q "\"name\":\"$1\""; then
          echo "already linked: $1"; return 0
        fi
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --data-urlencode "name=$1" \
          --data-urlencode "url=${PACKAGE_URL}/${CI_COMMIT_TAG}/$1" \
          --data-urlencode "link_type=$2" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"
        echo
      }
      for file in s3mail-windows-amd64.zip:package \
                   s3mail-macos-arm64.zip:package \
                   s3mail-macos-amd64.zip:package \
                   s3mail-linux-amd64.zip:package \
                   SHA256SUMS:other; do
        link "${file%:*}" "${file#*:}"
      done
      # The signature only gets a link when it was actually uploaded - see
      # upload. A link to a signature that is nowhere is worse than no link;
      # that is what went wrong at v1.0.0.
      if [ "${SIGNED:-no}" = "yes" ]; then
        link SHA256SUMS.sig other
      fi

# The install notes under the release: semantic-release appended them from
# its own job; now they are a job of their own on the tag pipeline, after the
# links, against the release yasrt created before it triggered this pipeline.
release:footer:
  stage: release
  image: registry.ole-hartwig.eu/devops/images/node:24
  before_script: []
  needs: ["release:links"]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    - TAG="$CI_COMMIT_TAG" node .gitlab/release-footer.mjs

# --------------------------------------------------------------------------- #
# The consumer is no longer built from here
#
# Until 2026-09-14 a job in this position triggered development/s3mail/ios on
# every push to main, because ios built its gomobile bridge against a checkout
# of this repository's main and nothing else would have caught a break here
# (!57 raising go.mod cost three days that way). Since ios requires the Go
# module by version (github.com/ohartwig/s3mail, ios!26), a change here
# reaches it as a dependency update with a pipeline of its own; building ios against every
# push to main would test a combination nobody ships, at the price of a Mac
# build per push. ios's workflow still accepts a triggered pipeline, so a
# trigger by hand remains possible when somebody wants to see one.
# --------------------------------------------------------------------------- #
