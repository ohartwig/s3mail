<!doctype html>
<html lang="{{.Lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>s3mail</title>
<style>
  :root {
    --bg:#0f1216; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
    --text:#e6edf3; --muted:#8b98a5; --accent:#4c8dff; --danger:#f2596b;
    --radius:10px;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --panel:#fff; --panel2:#eef2f7; --line:#dce3ec;
            --text:#16202b; --muted:#5d6b7a; }
  }
  * { box-sizing:border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; overflow:hidden;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--text); }
  header { display:flex; gap:10px; align-items:center; padding:9px 14px;
           border-bottom:1px solid var(--line); background:var(--panel); }
  header b { font-size:15px; }
  .box { font-size:12px; color:var(--muted); }
  input, textarea, button, select { font:inherit; color:var(--text); }
  #q { flex:1; padding:7px 12px; border-radius:var(--radius);
       border:1px solid var(--line); background:var(--panel2); min-width:120px; }
  #q:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  button { background:var(--panel2); border:1px solid var(--line); color:var(--text);
           border-radius:var(--radius); padding:6px 11px; cursor:pointer; }
  button:hover:not(:disabled) { border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  /* Der Sprachumschalter sieht aus wie die Knoepfe daneben - er steht in
     derselben Reihe und tut dasselbe: er wechselt etwas an der Ansicht. */
  #lang { background:var(--panel2); border:1px solid var(--line);
          border-radius:var(--radius); padding:6px 8px; cursor:pointer; }
  #lang:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.danger { color:var(--danger); border-color:var(--danger); }
  button.ghost { background:none; border:none; padding:4px 6px; }
  main { flex:1; display:flex; min-height:0; }

  /* Sidebar */
  #side { width:224px; flex:none; border-right:1px solid var(--line);
          background:var(--panel); overflow-y:auto; padding:8px 0 20px; }
  .sec { font-size:11px; letter-spacing:.08em; text-transform:uppercase;
         color:var(--muted); padding:12px 14px 4px; display:flex;
         justify-content:space-between; align-items:center; }
  .nav { display:flex; align-items:center; gap:8px; padding:6px 14px; cursor:pointer;
         border-left:3px solid transparent; }
  .nav:hover { background:var(--panel2); }
  .nav.sel { background:var(--panel2); border-left-color:var(--accent); }
  .nav .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .nav .cnt { font-size:11.5px; color:var(--muted); }
  .nav.unread .name { font-weight:700; }
  .nav.unread .cnt { color:var(--accent); font-weight:700; }
  .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  .side-in { display:flex; gap:4px; padding:4px 10px 4px 14px; }
  .side-in input { flex:1; min-width:0; padding:4px 8px; border-radius:6px;
                   border:1px solid var(--line); background:var(--panel2); }

  /* Liste */
  #listwrap { width:432px; flex:none; border-right:1px solid var(--line);
              display:flex; flex-direction:column; background:var(--panel); }
  #tools { display:flex; align-items:center; gap:5px; padding:7px 10px;
           border-bottom:1px solid var(--line); flex-wrap:wrap; min-height:44px; }
  #tools button { padding:5px 8px; }
  #tools .grow { flex:1; }
  #list { flex:1; overflow-y:auto; }
  .item { display:flex; gap:8px; padding:9px 12px; border-bottom:1px solid var(--line);
          cursor:pointer; }
  .item:hover { background:var(--panel2); }
  .item.sel { background:var(--panel2); box-shadow:inset 3px 0 0 var(--accent); }
  .item.checked { background:color-mix(in srgb, var(--accent) 12%, var(--panel)); }
  .item .col { flex:1; min-width:0; }
  .item .row { display:flex; justify-content:space-between; gap:8px; }
  .item .from { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item.unread .from, .item.unread .subj { font-weight:700; }
  .item .date { color:var(--muted); font-size:11.5px; white-space:nowrap; }
  .item .subj, .item .snip { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .item .snip { color:var(--muted); font-size:12.5px; }
  .star { cursor:pointer; color:var(--muted); font-size:13px; line-height:1; }
  .star.on { color:#e0a33e; }
  .chip { font-size:10.5px; padding:0 6px; border-radius:99px; line-height:16px;
          display:inline-block; vertical-align:1px; color:#fff; }
  .tag-line { display:flex; gap:4px; flex-wrap:wrap; margin-top:3px; }
  .flag { font-size:10.5px; padding:0 6px; border-radius:99px; line-height:16px;
          border:1px solid var(--line); color:var(--muted); }
  .flag.bad { color:var(--danger); border-color:var(--danger); }

  /* Ansicht */
  #view { flex:1; overflow-y:auto; padding:18px 24px; min-width:0; }
  #view h2 { margin:0 0 6px; font-size:19px; }
  .meta { color:var(--muted); font-size:13px; }
  .bar { display:flex; gap:8px; margin:14px 0; flex-wrap:wrap; align-items:center; }
  pre.body { white-space:pre-wrap; word-wrap:break-word; font:inherit;
             background:var(--panel); border:1px solid var(--line);
             border-radius:var(--radius); padding:14px; }
  iframe.body { width:100%; height:58vh; border:1px solid var(--line);
                border-radius:var(--radius); background:#fff; }
  .atts { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0; }
  .att { display:inline-flex; gap:6px; align-items:center; text-decoration:none;
         color:var(--text); background:var(--panel); border:1px solid var(--line);
         border-radius:var(--radius); padding:6px 10px; font-size:13px; }
  .att:hover { border-color:var(--accent); }
  .empty { color:var(--muted); padding:40px; text-align:center; }

  /* Menues + Dialoge */
  .menu { position:fixed; z-index:40; background:var(--panel); border:1px solid var(--line);
          border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,.35); padding:6px;
          min-width:200px; max-height:60vh; overflow:auto; }
  .menu div.opt { padding:6px 10px; border-radius:6px; cursor:pointer;
                  display:flex; gap:8px; align-items:center; }
  .menu div.opt:hover { background:var(--panel2); }
  .menu input { width:100%; padding:5px 8px; border-radius:6px;
                border:1px solid var(--line); background:var(--panel2); }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--panel);
           color:var(--text); width:min(720px,92vw); padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.55); }
  .pad { padding:18px; display:flex; flex-direction:column; gap:10px; }
  .pad input, .pad textarea, .pad select { width:100%; padding:7px 10px; border-radius:8px;
      border:1px solid var(--line); background:var(--panel2); }
  .pad textarea { min-height:200px; resize:vertical; font-family:ui-monospace,monospace; }
  .pad label { font-size:12px; color:var(--muted); }
  .rule { display:grid; grid-template-columns:1fr 90px 1fr 1fr 34px; gap:6px;
          align-items:center; }
  .rule select, .rule input { padding:5px 7px; }
  .err { color:var(--danger); min-height:18px; }
  .toast { position:fixed; bottom:18px; right:18px; z-index:60; background:var(--panel);
           border:1px solid var(--line); border-left:3px solid var(--accent);
           border-radius:8px; padding:10px 14px; box-shadow:0 8px 24px rgba(0,0,0,.3); }
</style>
</head>
<body>
<header>
  <b>s3mail</b><span class="box" id="box"></span>
  <button class="primary" id="new" title="{{t "nav.new.title"}}">{{t "nav.new"}}</button>
  <input id="q" placeholder="{{t "search.placeholder"}}">
  <button id="rulesBtn" title="{{t "nav.rules.title"}}">{{t "nav.rules"}}</button>
  <button id="blockedBtn" title="{{t "nav.blocked.title"}}">{{t "nav.blocked"}}</button>
  <button onclick="location.href='/setup'" title="{{t "nav.settings.title"}}">{{t "nav.settings"}}</button>
  <button id="refresh">{{t "nav.refresh"}}</button>
  <select id="lang" title="{{t "nav.language"}}" aria-label="{{t "nav.language"}}"></select>
  <button id="quit" title="{{t "nav.quit.title"}}">{{t "nav.quit"}}</button>
</header>
<main>
  <div id="side"></div>
  <div id="listwrap">
    <div id="tools"></div>
    <div id="list"><div class="empty">{{t "list.loading"}}</div></div>
  </div>
  <div id="view"><div class="empty">{{t "list.empty"}}</div></div>
</main>

<dialog id="dlgCompose"><form class="pad" method="dialog">
  <b id="c_title">{{t "compose.reply"}}</b>
  <div><label>{{t "compose.from"}}</label><input id="c_from"></div>
  <div><label>{{t "compose.to"}}</label><input id="c_to"></div>
  <div><label>Cc</label><input id="c_cc"></div>
  <div><label>{{t "compose.bcc"}}</label><input id="c_bcc"></div>
  <div><label>{{t "compose.subject"}}</label><input id="c_subject"></div>
  <div><label>{{t "compose.body"}}</label><textarea id="c_body"></textarea></div>
  <div><label>{{t "compose.attachments"}}</label><div>
    <button id="c_attach" type="button">📎 {{t "compose.attach"}}</button>
    <input id="c_files" type="file" multiple hidden>
    <div id="c_atts" class="atts"></div>
  </div></div>
  <div id="c_err" class="err"></div>
  <div class="bar" style="justify-content:flex-end;margin:0">
    <button value="cancel" id="c_cancel">{{t "action.cancel"}}</button>
    <button id="c_draft" type="button">{{t "compose.saveDraft"}}</button>
    <button class="primary" id="c_send" type="button">{{t "compose.send"}}</button>
  </div>
</form></dialog>

<dialog id="dlgRules"><form class="pad" method="dialog">
  <b>{{t "rules.title"}}</b>
  <div class="box">{{t "rules.explain"}}</div>
  <div class="rule box"><span>{{t "rules.contains"}}</span><span>{{t "rules.field"}}</span><span>{{t "rules.folder"}}</span><span>{{t "rules.tags"}}</span><span></span></div>
  <div id="ruleRows" style="display:flex;flex-direction:column;gap:6px"></div>
  <div class="bar" style="margin:4px 0 0">
    <button type="button" id="ruleAdd">{{t "rules.add"}}</button>
    <button type="button" id="ruleApply">{{t "rules.applyAll"}}</button>
    <span class="grow" style="flex:1"></span>
    <button value="cancel">{{t "action.close"}}</button>
    <button type="button" class="primary" id="ruleSave">{{t "action.save"}}</button>
  </div>
  <div id="r_err" class="err"></div>
</form></dialog>

<dialog id="dlgBlocked"><form class="pad" method="dialog">
  <b>{{t "blocked.title"}}</b>
  <div class="hint" style="margin:6px 0 10px">{{t "blocked.explain"}}</div>
  <div id="bl_list" class="box" style="max-height:320px;overflow:auto">{{t "list.loading"}}</div>
  <div class="bar" style="justify-content:flex-end;margin:10px 0 0">
    <button value="cancel">{{t "action.close"}}</button>
  </div>
</form></dialog>

<dialog id="dlgConfirm"><form class="pad" method="dialog">
  <b id="cf_title">{{t "confirm.title"}}</b>
  <div id="cf_text" class="box"></div>
  <div class="bar" style="justify-content:flex-end;margin:0">
    <button value="cancel">{{t "action.cancel"}}</button>
    <button type="button" class="danger" id="cf_ok">{{t "action.deleteForever"}}</button>
  </div>
</form></dialog>

<script>
const CFG = __CONFIG__;
const T = __I18N__;
const LANGS = __LANGUAGES__;
const $ = s => document.querySelector(s);
let messages = [], over = {folders:[], tags:{}, rules:[]}, current = null;
let folder = "", tagFilter = null, onlyUnread = false, onlyStar = false;
let checked = new Set(), lastIdx = null, mode = "reply", showImages = false, msg = null;

$("#box").textContent = CFG.bucket + "/" + (CFG.root || "");

const esc = s => (s ?? "").toString().replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtDate = iso => {
  const d = new Date(iso), n = new Date();
  return d.toDateString() === n.toDateString()
    ? d.toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"})
    : d.toLocaleDateString([], {day:"2-digit", month:"2-digit", year:"2-digit"});
};
const fmtSize = n => n < 1024 ? n + " B"
  : n < 1048576 ? (n/1024).toFixed(1) + " KB" : (n/1048576).toFixed(1) + " MB";
const folderLabel = f => (over.folders.find(x => x.name === f) || {}).label || f || T["folder.inbox"];

function toast(text, bad) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = text;
  if (bad) t.style.borderLeftColor = "var(--danger)";
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

async function api(path, body) {
  const opts = body ? {method:"POST", headers:{"Content-Type":"application/json"},
                       body: JSON.stringify(body)} : undefined;
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({error:T["error.unreadable"]}));
  if (!r.ok || d.error) throw new Error(d.error || ("HTTP " + r.status));
  if (d.folders) { over = {folders:d.folders, tags:d.tags, rules:d.rules,
                           state_remote:d.state_remote, allow_delete:d.allow_delete}; }
  return d;
}
const guard = fn => (...a) => fn(...a).catch(e => toast(e.message, true));

/* ---------------- Sidebar ---------------- */
function renderSide() {
  const tags = Object.entries(over.tags);
  const tagCounts = {};
  messages.forEach(m => (m.tags || []).forEach(t => tagCounts[t] = (tagCounts[t]||0)+1));
  $("#side").innerHTML = `
    <div class="sec">${T["side.folders"]} <button class="ghost" id="addFolder" title="${T["side.newFolder"]}">+</button></div>
    <div id="folders">${over.folders.map(f => `
      <div class="nav${folder === f.name && !tagFilter ? " sel" : ""}${f.unread ? " unread" : ""}"
           data-f="${esc(f.name)}">
        <span>${f.icon}</span><span class="name">${esc(f.label)}</span>
        <span class="cnt">${f.unread ? f.unread + "/" : ""}${f.count}</span>
      </div>`).join("")}</div>
    <div class="side-in" id="newFolderBox" style="display:none">
      <input id="newFolderName" placeholder="${T["side.folderName"]}">
      <button id="newFolderOk">OK</button>
    </div>
    <div class="sec">Filter</div>
    <div class="nav${onlyUnread ? " sel" : ""}" id="fUnread"><span>●</span><span class="name">Ungelesen</span></div>
    <div class="nav${onlyStar ? " sel" : ""}" id="fStar"><span>★</span><span class="name">Markiert</span></div>
    <div class="sec">Tags</div>
    ${tags.length ? tags.map(([name, color]) => `
      <div class="nav${tagFilter === name ? " sel" : ""}" data-t="${esc(name)}">
        <span class="dot" style="background:${esc(color)}"></span>
        <span class="name">${esc(name)}</span>
        <span class="cnt">${tagCounts[name] || ""}</span>
        <span class="star" data-deltag="${esc(name)}" title="${T["side.deleteTag"]}">✕</span>
      </div>`).join("") : '<div class="box" style="padding:2px 14px">noch keine</div>'}
    ${over.state_remote === false ? '<div class="sec" style="color:var(--danger)">Zustand nur lokal<br>(kein Schreibrecht im Bucket)</div>' : ""}`;

  $("#side").querySelectorAll("[data-f]").forEach(el => el.onclick = () => {
    folder = el.dataset.f; tagFilter = null; current = null; checked.clear(); load();
  });
  $("#side").querySelectorAll("[data-t]").forEach(el => el.onclick = e => {
    if (e.target.dataset.deltag) return;
    tagFilter = tagFilter === el.dataset.t ? null : el.dataset.t; load();
  });
  $("#side").querySelectorAll("[data-deltag]").forEach(el => el.onclick = guard(async e => {
    e.stopPropagation();
    await api("/api/tags", {action:"delete", name: el.dataset.deltag});
    if (tagFilter === el.dataset.deltag) tagFilter = null;
    load();
  }));
  $("#fUnread").onclick = () => { onlyUnread = !onlyUnread; load(); };
  $("#fStar").onclick = () => { onlyStar = !onlyStar; load(); };
  $("#addFolder").onclick = e => {
    e.stopPropagation();
    const box = $("#newFolderBox");
    box.style.display = box.style.display === "none" ? "flex" : "none";
    if (box.style.display === "flex") $("#newFolderName").focus();
  };
  const create = () => {
    const name = $("#newFolderName").value.trim();
    if (!name) return;
    if (!over.folders.some(f => f.name === name))
      over.folders.push({name, label:name, icon:"📁", count:0, unread:0, system:false});
    folder = name; $("#newFolderName").value = ""; load();
  };
  $("#newFolderOk").onclick = create;
  $("#newFolderName").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); create(); } };
}

/* ---------------- Werkzeugleiste ---------------- */
function renderTools() {
  const n = checked.size;
  const inTrash = folder === "trash";
  $("#tools").innerHTML = n === 0 ? `
      <label style="display:flex;gap:6px;align-items:center">
        <input type="checkbox" id="all"> <span class="box">${messages.length} ${T["list.messages"]}${tagFilter ? " · " + T["list.tag"] + ": " + esc(tagFilter) : ""}</span>
      </label>
      <span class="grow"></span>
      ${inTrash && over.allow_delete ? `<button class="danger" id="emptyTrash">${T["tools.emptyTrash"]}</button>` : ""}
    ` : `
      <label style="display:flex;gap:6px;align-items:center">
        <input type="checkbox" id="all" checked> <span class="box"><b>${n}</b> ${T["tools.selected"]}</span>
      </label>
      <button id="mMove">${T["tools.move"]} ▾</button>
      <button id="mTag">${T["tools.tag"]} ▾</button>
      <button id="mRead" title="${T["tools.readUnread"]}">●</button>
      <button id="mStar" title="${T["tools.star"]}">★</button>
      ${inTrash
        ? (over.allow_delete ? `<button class="danger" id="mPurge">${T["action.deleteForever"]}</button>` : "")
        : `<button id="mTrash" title="${T["tools.toTrash"]}">🗑</button>`}
    `;
  const all = $("#all");
  if (all) {
    all.indeterminate = n > 0 && n < messages.length;
    all.onclick = () => {
      if (checked.size) checked.clear();
      else messages.forEach(m => checked.add(m.key));
      renderList(); renderTools();
    };
  }
  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#emptyTrash", () => confirmDelete(null));
  on("#mPurge", () => confirmDelete([...checked]));
  on("#mTrash", guard(async () => { await move([...checked], "trash"); }));
  on("#mRead", guard(async () => {
    const anyUnread = messages.some(m => checked.has(m.key) && !m.read);
    await api("/api/flag", {keys:[...checked], read: anyUnread});
    checked.clear(); load();
  }));
  on("#mStar", guard(async () => {
    const anyOff = messages.some(m => checked.has(m.key) && !m.star);
    await api("/api/flag", {keys:[...checked], star: anyOff});
    load();
  }));
  on("#mMove", e => folderMenu(e.target, guard(async f => { await move([...checked], f); })));
  on("#mTag", e => tagMenu(e.target, [...checked]));
}

/* ---------------- Menues ---------------- */
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", e => {
  if (!e.target.closest(".menu") && !e.target.closest("button")) closeMenus();
});

function openMenu(anchor, html) {
  closeMenus();
  const r = anchor.getBoundingClientRect();
  const m = document.createElement("div");
  m.className = "menu";
  m.innerHTML = html;
  m.style.left = Math.min(r.left, innerWidth - 240) + "px";
  m.style.top = (r.bottom + 4) + "px";
  document.body.appendChild(m);
  return m;
}

function folderMenu(anchor, pick) {
  const m = openMenu(anchor, over.folders.map(f =>
      `<div class="opt" data-f="${esc(f.name)}">${f.icon} ${esc(f.label)}</div>`).join("")
    + '<div class="opt" style="gap:4px"><input id="mkFolder" placeholder="${T["menu.newFolder"]}"></div>');
  m.querySelectorAll("[data-f]").forEach(el =>
    el.onclick = () => { closeMenus(); pick(el.dataset.f); });
  m.querySelector("#mkFolder").onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault(); const v = e.target.value.trim();
      if (v) { closeMenus(); pick(v); } }
  };
}

function tagMenu(anchor, keys) {
  const rows = Object.entries(over.tags).map(([name, color]) => {
    const all = messages.filter(m => keys.includes(m.key)).every(m => (m.tags||[]).includes(name));
    return `<div class="opt" data-tag="${esc(name)}" data-on="${all ? 1 : 0}">
      <span class="dot" style="background:${esc(color)}"></span>${esc(name)}
      <span style="flex:1"></span>${all ? "✓" : ""}</div>`;
  }).join("");
  const m = openMenu(anchor, rows + '<div class="opt"><input id="mkTag" placeholder="${T["menu.newTag"]}"></div>');
  m.querySelectorAll("[data-tag]").forEach(el => el.onclick = guard(async () => {
    const on = el.dataset.on === "1";
    await api("/api/tag", {keys, [on ? "remove" : "add"]: [el.dataset.tag]});
    closeMenus(); load();
  }));
  m.querySelector("#mkTag").onkeydown = guard(async e => {
    if (e.key !== "Enter") return;
    e.preventDefault();
    const v = e.target.value.trim();
    if (!v) return;
    await api("/api/tag", {keys, add:[v]});
    closeMenus(); load();
  });
}

/* ---------------- Aktionen ---------------- */
async function move(keys, target) {
  const res = await api("/api/move", {keys, folder: target});
  checked.clear();
  if (keys.includes(current)) { current = null; $("#view").innerHTML = `<div class="empty">${T["list.moved"]}</div>`; }
  toast(keys.length + (keys.length === 1 ? " " + T["list.message"] : " " + T["list.messages"]) + " → " + folderLabel(target));
  await load();
}

function confirmDelete(keys) {
  const n = keys ? keys.length : (over.folders.find(f => f.name === "trash") || {}).count || 0;
  $("#cf_text").textContent = keys
    ? T["confirm.deleteSome"].replace("%d", n)
    : T["confirm.emptyTrash"].replace("%d", n);
  $("#dlgConfirm").showModal();
  $("#cf_ok").onclick = guard(async () => {
    $("#dlgConfirm").close();
    const r = keys ? await api("/api/delete", {keys}) : await api("/api/empty-trash", {});
    checked.clear(); current = null;
    toast((r.deleted || 0) + " " + T["toast.deleted"]);
    $("#view").innerHTML = `<div class="empty">${T["list.empty"]}</div>`;
    await load();
  });
}

/* ---------------- Liste ---------------- */
function renderList() {
  const list = $("#list");
  if (!messages.length) {
    list.innerHTML = `<div class="empty">${T["list.nothingHere"]}</div>`;
    return;
  }
  list.innerHTML = messages.map((m, i) => `
    <div class="item${current === m.key ? " sel" : ""}${checked.has(m.key) ? " checked" : ""}${m.read ? "" : " unread"}" data-i="${i}">
      <input type="checkbox" ${checked.has(m.key) ? "checked" : ""} data-chk="${i}">
      <span class="star${m.star ? " on" : ""}" data-star="${i}">${m.star ? "★" : "☆"}</span>
      <div class="col">
        <div class="row"><span class="from">${esc(m.from || m.from_addr || "?")}</span>
          <span class="date">${fmtDate(m.date)}</span></div>
        <div class="subj">${esc(m.subject)}
          ${m.has_attachment ? '<span class="flag">📎</span>' : ""}
          ${m.spam ? '<span class="flag bad">Spam</span>' : ""}
          ${m.virus ? '<span class="flag bad">Virus</span>' : ""}
          ${folder === "*" || tagFilter ? `<span class="flag">${esc(folderLabel(m.folder))}</span>` : ""}</div>
        <div class="snip">${esc(m.snippet)}</div>
        ${(m.tags || []).length ? `<div class="tag-line">${m.tags.map(t =>
          `<span class="chip" style="background:${esc(over.tags[t] || "#888")}">${esc(t)}</span>`).join("")}</div>` : ""}
      </div>
    </div>`).join("");

  list.querySelectorAll(".item").forEach(el => el.onclick = e => {
    const i = +el.dataset.i;
    if (e.target.dataset.chk !== undefined) return;
    if (e.target.dataset.star !== undefined) { e.stopPropagation(); toggleStar(i); return; }
    open(messages[i].key);
  });
  list.querySelectorAll("[data-chk]").forEach(el => el.onclick = e => {
    e.stopPropagation();
    const i = +el.dataset.chk;
    if (e.shiftKey && lastIdx !== null) {
      const [a, b] = [Math.min(lastIdx, i), Math.max(lastIdx, i)];
      for (let k = a; k <= b; k++) checked.add(messages[k].key);
    } else {
      checked.has(messages[i].key) ? checked.delete(messages[i].key) : checked.add(messages[i].key);
    }
    lastIdx = i;
    renderList(); renderTools();
  });
}

const toggleStar = guard(async i => {
  const m = messages[i];
  m.star = !m.star;
  renderList();
  await api("/api/flag", {keys:[m.key], star: m.star});
  renderSide();
});

async function load() {
  const p = new URLSearchParams({folder, q: $("#q").value, unread: onlyUnread ? "1" : "0",
                                 star: onlyStar ? "1" : "0"});
  if (tagFilter) p.set("tag", tagFilter);
  if (tagFilter) p.set("folder", "*");
  const d = await api("/api/messages?" + p.toString());
  messages = d.messages;
  checked = new Set([...checked].filter(k => messages.some(m => m.key === k)));
  renderSide(); renderTools(); renderList();
}

  current = key;
  $("#view").innerHTML = `<div class="empty">${T["list.loading"]}</div>`;
  msg = await api("/api/message?key=" + encodeURIComponent(key));
  const m = msg;
  const idx = messages.findIndex(x => x.key === key);

  if (idx >= 0) { messages[idx].read = true; messages[idx].tags = m.tags; }

  if (wasUnread) api("/api/overview").then(renderSide).catch(() => {});

  const atts = m.attachments.map(a => `

      m.bcc ? ` · <b>${T["compose.bcc"]}:</b> ${esc(m.bcc)}` : ""}</div>
    <div class="meta">${new Date(m.date).toLocaleString()} · ${esc(folderLabel(m.folder))}
      ${m.spam ? `<span class="flag bad">${T["view.spamFail"]}</span>` : ""}

    <div class="tag-line" style="margin-top:8px">${(m.tags||[]).map(t =>
      `<span class="chip" style="background:${esc(over.tags[t]||"#888")}">${esc(t)}</span>`).join("")}</div>
    <div class="bar">
      ${!CFG.can_send ? ""
        : m.folder === "drafts"
          ? `<button class="primary" id="editDraft">${T["compose.editDraft"]}</button>`
          : `<button class="primary" id="reply">${T["compose.reply"]}</button>` +
            `<button id="replyall">${T["compose.replyAll"]}</button>` +
            `<button id="forward">${T["compose.forward"]}</button>`}
      <button id="vStar">${m.star ? "★ " + T["view.starred"] : "☆ " + T["view.star"]}</button>
      <button id="vTag">${T["tools.tag"]} ▾</button>
      <button id="vMove">${T["tools.move"]} ▾</button>
      ${m.folder === "spam" ? `<button id="vHam">${T["view.notSpam"]}</button>`
                            : `<button id="vSpam">${T["folder.spam"]}</button>`}
      ${m.folder === "trash"
        ? (over.allow_delete ? `<button class="danger" id="vPurge">${T["action.deleteForever"]}</button>` : "")
        : `<button id="vTrash">🗑 ${T["folder.trash"]}</button>`}
      ${CFG.can_send ? `<button id="vBlock" title="${T["blocked.buttonTitle"]}">${T["blocked.button"]}</button>` : ""}
      <a class="att" href="/api/raw?key=${encodeURIComponent(key)}">⬇︎ .eml</a>
      ${m.html ? `<button id="imgs">${showImages ? T["view.blockImages"] : T["view.loadImages"]}</button>` : ""}
    </div>
    ${atts ? `<div class="atts">${atts}</div>` : ""}
    ${bodyHtml}`;

  const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
  on("#imgs", () => { showImages = !showImages; open(key); });
  on("#reply", () => compose("reply", false));
  on("#replyall", () => compose("reply", true));
  on("#forward", () => compose("forward", false));
  on("#editDraft", () => editDraft(key, m));
  on("#vTrash", () => move([key], "trash"));
  on("#vSpam", () => move([key], "spam"));
  on("#vHam", () => move([key], ""));
  on("#vPurge", () => confirmDelete([key]));
  on("#vMove", e => folderMenu(e.target, guard(async f => { await move([key], f); })));
  on("#vTag", e => tagMenu(e.target, [key]));
  on("#vBlock", () => blockFragen(m.reply_to || m.from));
  on("#vStar", guard(async () => {
    await api("/api/flag", {keys:[key], star: !m.star});
    m.star = !m.star; open(key);
  }));
  renderSide();
});

/* ---------------- Verfassen ---------------- */
function quote(m) {
  return "\n\n" + T["compose.quoteLine"].replace("%s", new Date(m.date).toLocaleString()).replace("%s", m.from) + "\n"
       + (m.text || "").split("\n").map(l => "> " + l).join("\n") + "\n";
}
function compose(kind, all) {
  const m = msg; mode = kind;
  $("#c_err").textContent = "";
  attachments = []; draftKey = "";
  renderAtts();
  $("#c_bcc").value = "";
  $("#c_from").value = CFG.default_from || "";
  // Eine neue Nachricht hat keine Vorlage - alles andere unten liest aus m,
  // das dann gar nicht da ist (nichts ausgewaehlt, leeres Postfach).
  if (kind === "new" || !m) {
    mode = "new";
    $("#c_title").textContent = T["compose.new"];
    for (const f of ["#c_to", "#c_cc", "#c_subject", "#c_body"]) $(f).value = "";
    composeStart = composeState();
    $("#dlgCompose").showModal();
    $("#c_to").focus();
    return;
  }
  $("#c_title").textContent = kind === "forward" ? T["compose.forward"] : T["compose.reply"];
  const sub = m.subject || "";
  $("#c_to").value = kind === "forward" ? "" : (m.reply_to || m.from);
  $("#c_cc").value = (kind !== "forward" && all) ? [m.to, m.cc].filter(Boolean).join(", ") : "";
  $("#c_subject").value = kind === "forward"
    ? (/^fwd:/i.test(sub) ? sub : T["compose.fwdPrefix"] + " " + sub)
    : (/^(re|aw):/i.test(sub) ? sub : T["compose.rePrefix"] + " " + sub);
  $("#c_body").value = kind === "forward"
    ? "\n\n--- " + T["compose.forwardedMessage"] + " ---\n" + T["compose.from"] + ": " + m.from + "\n" + T["compose.to"] + ": " + m.to + "\n" + T["compose.date"] + ": " + new Date(m.date).toLocaleString() + "\n" + T["compose.subject"] + ": " + sub + "\n\n" + (m.text || "")
    : quote(m);
  composeStart = composeState();
  $("#dlgCompose").showModal();
  $("#c_body").setSelectionRange(0, 0);
  $("#c_body").focus();
}
/* Anhaenge des offenen Entwurfs: hier liegen sie als Bytes, genau wie frisch
   ausgewaehlte Dateien. Das kostet einen Weg ueber die Schleife (Server →
   Browser → Server), spart dafuer jede Sonderbehandlung beim Senden - fuer den
   Server ist ein weitergeschriebener Entwurf dasselbe wie eine neue Mail. */
let attachments = [];
let draftKey = "";
let composeStart = "";

const MAX_MAIL = 10 * 1024 * 1024;

function renderAtts() {
  $("#c_atts").innerHTML = attachments.map((a, i) => `
    <span class="att">📎 ${esc(a.filename)} <span class="date">${fmtSize(a.size)}</span>
      <button type="button" data-i="${i}" title="${T["compose.remove"]}">✕</button></span>`).join("");
  for (const b of $("#c_atts").querySelectorAll("button")) {
    b.onclick = () => { attachments.splice(+b.dataset.i, 1); renderAtts(); };
  }
}

/* Der Browser liefert die Datei als ArrayBuffer; base64 ist, was JSON von einem
   []byte auf der Go-Seite erwartet. */
function toBase64(buf) {
  let s = "";
  const b = new Uint8Array(buf);
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function attBytes() {
  return attachments.reduce((n, a) => n + a.content.length, 0);
}
async function addFiles(files) {
  // Erst sammeln, dann eine Meldung setzen. Wer hier sofort schreibt, loescht
  // sich die Zeile gleich wieder: eine abgelehnte Datei zaehlt nicht mit, die
  // Summe ist danach klein, und der Hinweis auf die abgelehnte Datei ist weg.
  let fehler = "";
  for (const f of files) {
    if (f.size > MAX_MAIL) { fehler = T["compose.attachmentTooLarge"].replace("%s", f.name); continue; }
    const content = toBase64(await f.arrayBuffer());
    // size ist die Datei, content die base64-Fassung davon: das eine steht im
    // Chip, das andere zaehlt gegen die Grenze, die SES zieht.
    attachments.push({filename: f.name, content_type: f.type || "application/octet-stream",
      content, size: f.size});
  }
  renderAtts();
  // Der Server lehnt zu grosse Mail ohnehin ab - nur erfaehrt es der Schreiber
  // hier, bevor er auf "Senden" drueckt und den Text noch einmal tippen darf.
  if (attBytes() > MAX_MAIL) fehler = T["compose.tooLarge"];
  $("#c_err").textContent = fehler;
}
$("#c_attach").onclick = () => $("#c_files").click();
$("#c_files").onchange = async e => { await addFiles(e.target.files); e.target.value = ""; };

function draftBody() {
  return {mode, key: mode === "new" ? "" : current, draft_key: draftKey,
    from: $("#c_from").value, to: $("#c_to").value, cc: $("#c_cc").value, bcc: $("#c_bcc").value,
    subject: $("#c_subject").value, body: $("#c_body").value, attachments};
}
// Woran sich erkennen laesst, ob seit dem Oeffnen etwas passiert ist. Ohne das
// fragt der Dialog beim Schliessen auch dann nach, wenn niemand etwas getippt hat.
function composeState() {
  return JSON.stringify([$("#c_to").value, $("#c_cc").value, $("#c_bcc").value,
    $("#c_subject").value, $("#c_body").value, attachments.length]);
}

async function saveDraft(quiet) {
  const r = await api("/api/draft", draftBody());
  draftKey = r.key;
  composeStart = composeState();
  if (!quiet) toast(T["compose.draftSaved"]);
  over = r; renderSide();
  if (folder === "drafts") await load();
  return r.key;
}

$("#c_draft").onclick = guard(async () => {
  try { await saveDraft(false); $("#dlgCompose").close(); }
  catch (e) { $("#c_err").textContent = e.message; }
});

/* Beim Schliessen nicht wortlos wegwerfen: getippter Text ist Arbeit. Gesichert
   wird nur, wenn seit dem Oeffnen wirklich etwas entstanden ist, und der Toast
   sagt es - sonst haette jemand einen Entwurf, von dem er nichts weiss. */
$("#dlgCompose").addEventListener("close", async () => {
  if (composeState() === composeStart) return;
  try { await saveDraft(false); } catch (e) { toast(e.message, true); }
});

async function editDraft(key, m) {
  compose("new");
  mode = "new";
  draftKey = key;
  $("#c_title").textContent = T["compose.editDraft"];
  $("#c_from").value = m.from || CFG.default_from || "";
  $("#c_to").value = m.to || "";
  $("#c_cc").value = m.cc || "";
  $("#c_bcc").value = m.bcc || "";
  $("#c_subject").value = m.subject || "";
  $("#c_body").value = m.text || "";
  // Die Anhaenge zurueckholen, damit ein weitergeschriebener Entwurf sie behaelt.
  for (const a of m.attachments || []) {
    try {
      const resp = await fetch(`/api/attachment?key=${encodeURIComponent(key)}&index=${a.index}`);
      if (!resp.ok) continue;
      const buf = await resp.arrayBuffer();
      attachments.push({filename: a.filename, content_type: a.content_type || "application/octet-stream",
        content: toBase64(buf), size: buf.byteLength});
    } catch (e) { /* ein fehlender Anhang darf den Entwurf nicht blockieren */ }
  }
  renderAtts();
  composeStart = composeState();
}

$("#c_send").onclick = async () => {
  const b = $("#c_send"); b.disabled = true; b.textContent = T["compose.sending"];
  try {
    const r = await api("/api/send", draftBody());
    composeStart = composeState();   // nichts mehr zu sichern, die Mail ist raus
    $("#dlgCompose").close();
    toast(T["compose.sent"].replace("%s", r.message_id));
    if (r.warning) toast(r.warning, true);
    if (r.folders) { over = r; renderSide(); }
    if (folder === "drafts" || folder === "sent") await load();
  } catch (e) { $("#c_err").textContent = e.message; }
  finally { b.disabled = false; b.textContent = T["compose.send"]; }
};

/* ---------------- Sperrliste ---------------- */
// Die Liste gehoert dem Konto, nicht dem Postfach - deshalb fragt der Knopf
// nach, und deshalb gibt es den Weg zurueck gleich daneben. Ein Tippfehler
// sperrt sonst einen Geschaeftspartner fuer das ganze Team, ohne dass jemand
// sieht, wo es klemmt.
function blockFragen(adresse) {
  $("#cf_title").textContent = T["blocked.confirmTitle"];
  $("#cf_text").textContent = T["blocked.confirmText"].replace("%s", adresse);
  const ok = $("#cf_ok"), text = ok.textContent;
  ok.textContent = T["blocked.block"];
  $("#dlgConfirm").showModal();
  ok.onclick = guard(async () => {
    $("#dlgConfirm").close();
    ok.textContent = text;
    await api("/api/block", {address: adresse});
    toast(T["blocked.blockedToast"].replace("%s", adresse));
  });
  $("#dlgConfirm").addEventListener("close", () => { ok.textContent = text; }, {once: true});
}

async function zeigeGesperrte() {
  $("#dlgBlocked").showModal();
  $("#bl_list").textContent = T["list.loading"];
  try {
    const d = await api("/api/blocked");
    renderGesperrte(d.blocked || []);
  } catch (e) { $("#bl_list").textContent = e.message; }
}
function renderGesperrte(liste) {
  if (!liste.length) { $("#bl_list").textContent = T["blocked.none"]; return; }
  $("#bl_list").innerHTML = liste.map(e => `
    <div class="check" style="justify-content:space-between">
      <div><b>${esc(e.address)}</b>
        <div class="d">${e.reason === "BOUNCE" ? T["blocked.bounce"] : T["blocked.complaint"]}${
          e.since ? " · " + T["blocked.since"] + " " + new Date(e.since).toLocaleDateString() : ""}</div></div>
      <button type="button" data-a="${esc(e.address)}">${T["blocked.unblock"]}</button>
    </div>`).join("");
  for (const b of $("#bl_list").querySelectorAll("button")) {
    b.onclick = guard(async () => {
      const d = await api("/api/unblock", {address: b.dataset.a});
      toast(T["blocked.unblockedToast"].replace("%s", b.dataset.a));
      renderGesperrte(d.blocked || []);
    });
  }
}

$("#ruleAdd").onclick = () => $("#ruleRows").appendChild(ruleRow());

$("#ruleSave").onclick = guard(async () => {

$("#ruleApply").onclick = guard(async () => {

/* ---------------- Start / Tastatur ---------------- */
/* ---------------- Automatischer Abgleich ----------------
   Damit neue Mail von selbst auftaucht, statt auf "Neu laden" zu warten.
   Kostet fast nichts: der Abgleich listet den Bucket und holt nur Objekte,
   deren ETag sich geaendert hat.

   Zwei Zurueckhaltungen: nicht laufen, solange das Fenster im Hintergrund ist
   (dort schaut niemand hin, und der Browser drosselt Timer ohnehin), und nicht
   waehrend gerade geschrieben wird - ein Neuaufbau der Liste unter einem
   offenen Entwurf ist schlimmer als eine Mail, die eine Minute spaeter kommt. */
let autoTimer = null;

function autoAbgleichPlanen() {
  const sek = CFG.refresh_seconds | 0;
  if (autoTimer) clearInterval(autoTimer);
  if (sek <= 0) return;
  autoTimer = setInterval(async () => {
    if (document.visibilityState !== "visible") return;
    if (document.querySelector("#compose")) return;   // Entwurf offen
    if ($("#refresh").disabled) return;               // laeuft schon
    try {
      const vorher = messages.length;
      const s = await api("/api/refresh", {});
      await load();
      if (messages.length > vorher) {
        toast((messages.length - vorher) + " neue Mail");
      }
    } catch (e) { /* stiller Abgleich meldet keine Fehler weiter */ }
  }, sek * 1000);
}

document.addEventListener("visibilitychange", () => {
  // Beim Zurueckkommen sofort nachsehen, statt bis zum naechsten Takt zu warten.
  if (document.visibilityState === "visible" && (CFG.refresh_seconds | 0) > 0) {
    if (!document.querySelector("#compose") && !$("#refresh").disabled) {
      api("/api/refresh", {}).then(() => load()).catch(() => {});
    }
  }
});

$("#quit").onclick = guard(async () => {
  if (!confirm("s3mail beenden?")) return;
  await api("/api/quit", {});
  document.body.innerHTML =
    '<div style="display:flex;height:100vh;align-items:center;justify-content:center;' +
    'flex-direction:column;gap:10px;color:var(--muted);font:15px/1.6 -apple-system,sans-serif">' +
    '<div style="font-size:34px">\uD83D\uDC4B</div><div>s3mail ist beendet.</div>' +
    '<div style="font-size:13px">Dieses Fenster kann geschlossen werden.</div></div>';
  setTimeout(() => window.close(), 600);   // im App-Fenster schliesst das wirklich
});

$("#refresh").onclick = guard(async () => {
  const b = $("#refresh"); b.disabled = true; b.textContent = T["list.loading"];
  try {
    const s = await api("/api/refresh", {});
    if (s.error) toast(s.error, true);
    else toast((s.total ? T["refresh.indexed"].replace("%d", s.total) : T["refresh.nothingNew"])
               + (s.moved ? " · " + T["refresh.filed"].replace("%d", s.moved) : ""));
    await load();
  } finally { b.disabled = false; b.textContent = T["nav.refresh"]; }
});

if (CFG.can_send) {
  $("#new").onclick = () => compose("new");
  $("#blockedBtn").onclick = zeigeGesperrte;
} else {
  $("#new").style.display = "none";
  $("#blockedBtn").style.display = "none";
}

// Sprachumschalter. Die Liste kommt aus dem Server (LANGS), die aktuelle
// Sprache steht im lang-Attribut - so bleibt beides an einer Stelle richtig.
{
  const sel = $("#lang");
  if (sel) {
    sel.innerHTML = LANGS.map(l =>
      `<option value="${l.code}"${l.code === document.documentElement.lang ? " selected" : ""}>${l.name}</option>`).join("");
    sel.onchange = () => { location.href = "/language/" + sel.value; };
  }
}

let timer;
$("#q").oninput = () => { clearTimeout(timer); timer = setTimeout(load, 200); };
document.addEventListener("keydown", e => {
  if (document.querySelector("dialog[open]")) return;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
  if (e.key === "/" && !typing) { e.preventDefault(); $("#q").focus(); return; }
  // Vor der Abkuerzung unten: Schreiben geht auch im leeren Postfach, gerade da.
  if (e.key === "n" && !typing && CFG.can_send) { e.preventDefault(); compose("new"); return; }
  if (typing || !messages.length) return;
  const i = messages.findIndex(m => m.key === current);
  const go = j => { const m = messages[Math.max(0, Math.min(j, messages.length - 1))]; if (m) open(m.key); };
  if (e.key === "j" || e.key === "ArrowDown") { e.preventDefault(); go(i + 1); }
  else if (e.key === "k" || e.key === "ArrowUp") { e.preventDefault(); go(i < 0 ? 0 : i - 1); }
  else if (e.key === "x" && i >= 0) { checked.has(current) ? checked.delete(current) : checked.add(current); lastIdx = i; renderList(); renderTools(); }
  else if (e.key === "s" && i >= 0) toggleStar(i);
  else if (e.key === "e" && i >= 0) move([current], "archiv");
  else if ((e.key === "Delete" || e.key === "#") && i >= 0 && folder !== "trash") move([current], "trash");
});

load().then(() => {
        if (!messages.length && !over.folders.some(f => f.count)) $("#refresh").click();
        autoAbgleichPlanen();
      }).catch(e => toast(e.message, true));
</script>
</body>
</html>
