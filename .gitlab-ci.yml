# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
#
# Pipeline für s3mail (Go).
#
# Alle Jobs laufen untagged und landen damit auf `aws-spot-runner` – dem
# einzigen Runner des Projekts, der untagged Jobs annimmt (Docker, Linux/arm64).
# Die anderen verlangen ihre eigenen Tags und sind für Signing- und apk-Arbeit
# reserviert.
#
# Dass der Runner arm64 ist, spielt keine Rolle: Go kompiliert von dort für alle
# Zielplattformen, weil nichts in der Abhängigkeitskette CGO braucht. Genau
# deshalb ist das Projekt von Python nach Go gewandert – PyInstaller konnte
# grundsätzlich nur für die Plattform bauen, auf der es lief, und ein
# Windows-Paket war damit gar nicht herstellbar.
#
# Der Katalog unter devops/ci-cd-components ist PHP/TYPO3-seitig, für Go gibt es
# dort nichts – deshalb hier von Hand.

# Die Signatur über das Manifest kommt aus dem Bestand und nicht von Hand.
# devops/ci-cd-components/build-provenance/sign-artifact macht genau das:
# abgelöste cosign-Signatur über eine Datei, Schlüssel in KMS, Rolle über OIDC,
# und sie prüft die eigene Signatur nach, bevor sie den Job verlässt. Ein
# zweiter Weg zum selben Schlüssel wäre ein zweiter Weg, ihn falsch zu benutzen.
include:
  # Voller Tag und nicht ~latest oder @2: build-provenance ist kein
  # Katalog-Projekt, und dort loest GitLab nur einen vollstaendigen Tag auf.
  # Renovate haelt ihn nach.
  # renovate: datasource=gitlab-tags depName=devops/ci-cd-components/build-provenance
  - component: ${CI_SERVER_HOST}/devops/ci-cd-components/build-provenance/sign-artifact@2.0.54
    inputs:
      stage: release
      artifact-file: SHA256SUMS
      needs-config:
        - job: manifest
      # Muss zur Regel von manifest passen. Die Voreinstellung der Komponente
      # legt den Job auch auf dem Standardzweig an - dort gibt es kein manifest,
      # und ein needs auf einen Job, den die Pipeline nicht kennt, ist ein
      # Konfigurationsfehler: die Pipeline entsteht ohne einen einzigen Job und
      # gilt als gescheitert. Genau das ist nach dem Merge dreimal passiert.
      rules-config:
        - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/

stages:
  - test
  - build
  - release

variables:
  # GO_IMAGE aus einem eigenen goldenen Bild (devops/images/golang), nicht
  # mehr aus dem Minimus-Spiegel: Minimus stellt am 2026-10-22 den Betrieb
  # ein, und Go ist ein eigenständig gepflegtes Wolfi-Paket – kein Umweg
  # über einen dritten Spiegel nötig. Internal-sichtbare devops/images/*-
  # Projekte sind estate-weit ohne Allowlist-Eintrag ziehbar; die Job-Token-
  # Allowlist unten gilt nur noch für CURL_IMAGE aus devops/ci-mirrors.
  #
  # Bei 1.27 geblieben, nicht auf 1.25 zurückgefallen: das Bild-Repository
  # baut bewusst auf go-1.27, weil dieses Projekt hier schon einmal
  # (Commit 3f87e3d, 2026-08-23) von 1.25 auf 1.27 gewechselt ist – eine
  # bereits getroffene Entscheidung, die dieser Umbau fortsetzt, nicht
  # rückgängig macht. `:1.27` ist der mitlaufende Tag mit der echten
  # Go-Version, nicht die Release-Zählung des Bild-Repositories selbst (die
  # steht zusätzlich als unveränderlicher Tag daneben).
  GO_IMAGE: "registry.ole-hartwig.eu/devops/images/golang:1.27"
  # CURL_IMAGE ebenfalls aus einem eigenen goldenen Bild (devops/images/curl),
  # nicht mehr aus dem Minimus-Spiegel - selbe Begründung wie bei GO_IMAGE.
  # `:8.21` ist der mitlaufende Tag mit der echten curl-Version.
  CURL_IMAGE: "registry.ole-hartwig.eu/devops/images/curl:8.21"
  # Nicht heimlich eine andere Go-Version ziehen: was im Image ist, gilt.
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/s3mail"

default:
  image: ${GO_IMAGE}
  # Die Flotte besteht aus Spot-Instanzen: eine kann mitten im Job zurückgezogen
  # werden, und der Job stirbt dann mit "instance no longer running". Das ist
  # kein Fehler im Gebauten – beim ersten v0.2.1-Lauf traf es zwei von vier
  # Build-Jobs, während die anderen beiden auf demselben Commit durchliefen.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  before_script:
    - cd go
  cache:
    key:
      files:
        - go/go.sum
    paths:
      - .go/pkg/mod

# --------------------------------------------------------------------------- #
# Test
# --------------------------------------------------------------------------- #
test:
  stage: test
  script:
    - test -z "$(gofmt -l .)" || { echo "nicht formatiert:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - go/coverage.out
    expire_in: 1 week

# --------------------------------------------------------------------------- #
# Bauen – vier Plattformen aus einem Lauf
# --------------------------------------------------------------------------- #
.build:
  stage: build
  needs: [test]
  script:
    # -trimpath nimmt die Pfade des Baurechners aus dem Binary, damit zwei Läufe
    # dasselbe Ergebnis liefern.
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - mkdir -p dist
    # LDFLAGS trägt bei Windows zusätzlich -H windowsgui: sonst reißt der
    # Doppelklick ein Konsolenfenster auf, dessen Schließen den Server killt.
    - |
      CGO_ENABLED=0 GOOS="$TARGET_OS" GOARCH="$TARGET_ARCH" \
        go build -trimpath -ldflags="-s -w -X main.version=${VERSION} ${EXTRA_LDFLAGS:-}" \
        -o "dist/${BINARY}" ./cmd/s3mail
    # macOS bekommt ein App-Bundle statt einer nackten Unix-Datei. Ein Bundle ist
    # nur eine Verzeichnisstruktur mit einer Info.plist – das entsteht auch auf
    # Linux, ohne Apple-Werkzeug und ohne den Mac, den die Portierung losgeworden ist.
    # macOS hört hier auf: das Bundle geht als Artefakt an sign:macos, und erst
    # nach der Signatur wird gezippt. Andersherum müsste das ZIP wieder geöffnet
    # werden, und geheftet (`staple`) wird ohnehin das Bundle, nicht das Archiv.
    - |
      if [ "$TARGET_OS" = "darwin" ]; then
        # CFBundleVersion vertraegt nur Zahlen und Punkte. Was hier als VERSION
        # ankommt, ist aber ein Tag wie v0.9.0 oder v0.9.0-rc1, bei Zweiglaeufen
        # sogar eine Commit-Kurz-ID. Also zurechtschneiden: fuehrendes v weg,
        # Vorab-Anhang weg, und was dann immer noch keine Versionsnummer ist,
        # wird 0.0.0. Der volle Tag bleibt davon unberuehrt - der steckt ueber
        # -X main.version im Programm und ist das, was der Nutzer zu sehen kriegt.
        PLIST_VERSION=$(printf '%s' "${VERSION}" | sed 's/^v//; s/[-+].*$//')
        case "$PLIST_VERSION" in
          ''|*[!0-9.]*) PLIST_VERSION=0.0.0 ;;
        esac
        tools/bundle/build.sh "dist/${BINARY}" dist "${PLIST_VERSION}"
        rm "dist/${BINARY}"
        mv dist/s3mail.app "dist/s3mail-${LABEL}.app"
        exit 0
      fi
      go run tools/zip.go "dist/s3mail-${LABEL}.zip" "dist/${BINARY}"
      rm -rf "dist/${BINARY}"
    # Als ZIP, damit Ausführungs-Bit und Bundle-Struktur den Download überstehen –
    # eine roh heruntergeladene Datei kommt ohne +x an und startet nicht.
    # Gepackt wird mit Go, nicht mit /usr/bin/zip: das golang-Image bringt es
    # nicht mit, und ein apt-get dafür wäre ein zweiter Paketkanal in einer
    # Pipeline, die sonst nur Go braucht.
    - cd dist && sha256sum "s3mail-${LABEL}.zip" > "s3mail-${LABEL}.zip.sha256"
  artifacts:
    paths:
      - go/dist/
    expire_in: 1 month

build:windows-amd64:
  extends: .build
  variables: { TARGET_OS: windows, TARGET_ARCH: amd64, LABEL: windows-amd64, BINARY: s3mail.exe,
               EXTRA_LDFLAGS: "-H windowsgui" }

build:macos-arm64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: arm64, LABEL: macos-arm64, BINARY: s3mail }

build:macos-amd64:
  extends: .build
  variables: { TARGET_OS: darwin, TARGET_ARCH: amd64, LABEL: macos-amd64, BINARY: s3mail }

build:linux-amd64:
  extends: .build
  variables: { TARGET_OS: linux, TARGET_ARCH: amd64, LABEL: linux-amd64, BINARY: s3mail }

# --------------------------------------------------------------------------- #
# Signieren – nur macOS
#
# Ohne Signatur *blockiert* Gatekeeper das Programm beim ersten Start, und der
# einzige Ausweg ist `xattr -dr com.apple.quarantine`. Das ist die Hürde, an der
# jemand abspringt, der s3mail nicht selbst gebaut hat.
#
# Der Job läuft auf `az1a` und das ist keine Kosmetik: die allgemeine Flotte ist
# IPv6-only, und Apples Notary- und Zeitstempeldienst sind von dort nicht
# verlässlich erreichbar. Ohne den Tag scheitert die Notarisierung an etwas, das
# wie ein Netzfehler aussieht und keiner ist.
#
# Auf einem Tag wird mit dem echten Developer-ID-Zertifikat signiert und bei
# Apple notarisiert. Auf allen anderen Läufen mit einem Wegwerf-Zertifikat, ohne
# Notarisierung – Gatekeeper lehnt das Ergebnis ab, aber die Mechanik ist
# geprüft. Sonst fiele ein kaputter Signaturschritt erst auf, wenn ein Release
# ansteht, und dann ist er teuer.
#
# Dass die Grenze der Tag ist und nicht der Zweig, steht nicht nur hier: die
# Vertrauensrichtlinie der Rolle gitlab-ci-code-signing-role lässt
# AssumeRoleWithWebIdentity nur für sub=...ref_type:tag:ref:v* zu. Ein Zweiglauf
# kommt an die Secrets also gar nicht erst heran - er scheitert beim ersten
# GetSecretValue mit UnrecognizedClientException, was wie ein kaputter Zugang
# aussieht und keiner ist: die Rollenübernahme davor ist es, die nicht
# stattfindet. Wer den Schalter hier aufmachte, müsste auch die Richtlinie
# aufmachen - und damit wäre das Zertifikat über jeden Zweig erreichbar.
#
# Für den Probelauf mit echtem Material gibt es deshalb den Vorab-Tag: ein
# v0.9.0-rc1 wird signiert und notarisiert wie ein Release, veröffentlicht aber
# keins. upload und release verlangen einen Tag der Form vX.Y.Z, siehe unten.
# --------------------------------------------------------------------------- #
sign:macos:
  stage: build
  # Das goldene Bild bringt rcodesign, die AWS-CLI, openssl und zip mit. Der
  # eine Job im Bestand, der ein privates Signaturmaterial anfasst, installiert
  # währenddessen nichts nach und lädt nichts aus dem Netz – vorher waren das
  # ein `apk add` und ein Download von github.
  # renovate: datasource=docker depName=registry.ole-hartwig.eu/devops/images/code-signing
  image: registry.ole-hartwig.eu/devops/images/code-signing:1.0.2@sha256:cd703414647ebf03b8409966cee78d49579e12f8f8a913289ec2aad5282a909f
  tags: [az1a]
  needs:
    - build:macos-arm64
    - build:macos-amd64
  before_script: []
  id_tokens:
    GITLAB_OIDC_TOKEN:
      aud: https://git.ole-hartwig.eu
  # KEINE Variable in diesem Job darf mit RCODESIGN_ anfangen. rcodesign liest
  # seine Konfiguration aus Umgebungsvariablen mit genau diesem Präfix; der Rest
  # des Namens wird zum Konfigurationsschlüssel, und unbekannte Schlüssel weist
  # es zurück. Ein RCODESIGN_VERSION - das hier einmal stand - lässt jeden
  # Aufruf vor der Arbeit sterben:
  #   configuration file error / problem key: version
  #   problem: UnknownField("version", ["sign", "remote-sign"])
  # `rcodesign --version` antwortet dabei weiterhin, was die Suche verschleppt.
  variables:
    AWS_DEFAULT_REGION: eu-north-1
    AWS_ROLE_ARN: arn:aws:iam::714476370938:role/gitlab-ci-code-signing-role
    AWS_WEB_IDENTITY_TOKEN_FILE: /tmp/gitlab_oidc_token
  script:
    - echo "$GITLAB_OIDC_TOKEN" > /tmp/gitlab_oidc_token
    # Statische Schluessel wegraeumen, bevor die CLI sie sieht.
    #
    # Von irgendwoher - nicht aus diesem Projekt und nicht aus der Gruppe
    # development - stehen AWS_ACCESS_KEY_ID und AWS_SECRET_ACCESS_KEY in der
    # Job-Umgebung. In der Kette der AWS-CLI kommt die Umgebung vor der
    # Rollenuebernahme ueber OIDC: mit gesetzten Schluesseln werden AWS_ROLE_ARN
    # und das Token nie angesehen. Die Schluessel taugen nichts (sts
    # get-caller-identity antwortet InvalidClientTokenId), und der Job scheiterte
    # deshalb am ersten GetSecretValue mit UnrecognizedClientException - einer
    # Meldung, die nach kaputtem Secret klingt und nichts damit zu tun hat.
    #
    # Hier weg damit. Dieser Job soll ausschliesslich mit der Rolle arbeiten, die
    # ihm der Tag verschafft; alles andere waere ein zweiter Weg an dasselbe
    # Signaturmaterial.
    - unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN
    # Auf einem Tag das echte Material, sonst ein Wegwerf-Zertifikat.
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        # Haelt im Protokoll fest, als wer der Job arbeitet. Nur hier drin, nicht
        # davor: auf einem Zweig gibt es keine Rolle zu uebernehmen - die
        # Vertrauensrichtlinie laesst nur Tags zu -, und AWS verweigert dann
        # voellig zu Recht. Eine Kontrollzeile, die den Job umbringt, waere eine
        # schlechte Kontrollzeile.
        aws sts get-caller-identity
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-developer-id-p12 \
          --query SecretString --output text | base64 -d > /tmp/id.p12
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-developer-id-password \
          --query SecretString --output text > /tmp/id.pw
        aws secretsmanager get-secret-value --secret-id koh-code-signing/apple-notary-api-key \
          --query SecretString --output text > /tmp/notary.json
        REAL=yes
      else
        # Mit openssl statt `rcodesign generate-self-signed-certificate`, und
        # zwar absichtlich: dieselbe openssl-Zeile muss auch den echten
        # Developer-ID-Behälter erzeugen, also wird hier der Weg geprüft, auf den
        # es ankommt. Für --for-notarization taugt ein selbst erzeugtes
        # Zertifikat ohnehin nicht - das verlangt ein echtes Developer ID.
        openssl req -x509 -newkey rsa:2048 -sha256 -days 1 -nodes \
          -keyout /tmp/wegwerf.key -out /tmp/wegwerf.crt \
          -subj "/CN=s3mail CI Wegwerf/C=DE" 2>/dev/null
        # Die drei Schalter sind nicht Zierde: rcodesign liest PKCS#12 über die
        # Kiste `p12`, die den alten Behälter mit SHA1/3DES kennt und nicht das,
        # was OpenSSL 3 von sich aus schreibt (PBES2 mit AES-256-CBC). `-legacy`
        # täte dasselbe, verlangt aber den Legacy-Provider im Bild; 3DES steckt
        # im Standard-Provider und braucht ihn nicht.
        openssl pkcs12 -export -inkey /tmp/wegwerf.key -in /tmp/wegwerf.crt \
          -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
          -out /tmp/id.p12 -passout pass:wegwerf
        printf 'wegwerf' > /tmp/id.pw
        REAL=no
      fi
    # Absoluter Pfad, nicht `cd go/dist`: GitLab fuehrt alle script-Zeilen in
    # derselben Shell aus, ein zweites relatives cd landet also in go/dist/go/dist.
    - |
      cd "$CI_PROJECT_DIR/go/dist"
      for LABEL in macos-arm64 macos-amd64; do
        APP="s3mail-${LABEL}.app"
        if [ "$REAL" = "yes" ]; then
          # --for-notarization macht drei Dinge auf einmal: verlangt ein echtes
          # Developer-ID-Zertifikat, erzwingt den Zeitstempel und setzt den
          # Hardened Runtime - ohne den lehnt Apple die Notarisierung ab.
          rcodesign sign --p12-file /tmp/id.p12 --p12-password-file /tmp/id.pw \
            --for-notarization "$APP"
          rcodesign notary-submit --api-key-file /tmp/notary.json --staple "$APP"
        else
          # Ein selbst erzeugtes Zertifikat ist kein Developer ID, also geht
          # --for-notarization nicht. Der Hardened Runtime wird trotzdem gesetzt,
          # damit dieselbe Struktur entsteht wie im Ernstfall.
          rcodesign sign --p12-file /tmp/id.p12 --p12-password-file /tmp/id.pw \
            --code-signature-flags runtime "$APP"
        fi
        # Gezippt wird hier mit `zip` und nicht mit tools/zip.go: das Signaturbild
        # führt kein Go, und eine Toolchain dafür nachzuinstallieren wäre genau
        # das, wogegen das Bild gebaut wurde. Damit gibt es zwei Zipper im
        # Projekt - deshalb prüft der Schritt darunter die Eigenschaft, um die es
        # überhaupt geht, statt sich auf das Werkzeug zu verlassen.
        mv "$APP" s3mail.app
        zip -q -r -y "s3mail-${LABEL}.zip" s3mail.app
        rm -rf s3mail.app
        sha256sum "s3mail-${LABEL}.zip" > "s3mail-${LABEL}.zip.sha256"
      done
    # Ein Paket, dessen Ausführungsbit den Weg nicht übersteht, startet auf dem
    # Zielrechner nicht - und das merkt man erst dort. Also hier nachsehen.
    - |
      cd "$CI_PROJECT_DIR/go/dist"
      for LABEL in macos-arm64 macos-amd64; do
        rm -rf pruef && mkdir pruef && unzip -q "s3mail-${LABEL}.zip" -d pruef
        BIN=pruef/s3mail.app/Contents/MacOS/s3mail
        test -x "$BIN" || { echo "FEHLER: $LABEL - Ausfuehrungsbit verloren"; exit 1; }
        test -f pruef/s3mail.app/Contents/Info.plist || { echo "FEHLER: $LABEL - Info.plist fehlt"; exit 1; }
        test -d pruef/s3mail.app/Contents/_CodeSignature || { echo "FEHLER: $LABEL - keine Signatur im Bundle"; exit 1; }
        echo "$LABEL: Bundle vollstaendig, ausfuehrbar, signiert"
        rm -rf pruef
      done
    - rm -f /tmp/id.p12 /tmp/id.pw /tmp/notary.json /tmp/wegwerf.key /tmp/wegwerf.crt
  artifacts:
    paths:
      - go/dist/
    expire_in: 1 month

# --------------------------------------------------------------------------- #
# Ein Manifest über alle Pakete, damit sich prüfen lässt, was man geladen hat
#
# Je Paket liegt schon eine .sha256 daneben. Die beantwortet "ist die Datei heil
# angekommen" und nicht "kommt sie von uns": wer das Paket austauscht, tauscht
# die Prüfsumme daneben mit aus. Erst die Signatur über das Manifest macht aus
# der Prüfsumme eine Aussage - und zwar eine über alle vier Pakete auf einmal.
#
# macOS ist zusätzlich notarisiert; das Manifest ist der Weg für Windows und
# Linux, wo es keine Signatur im Paket gibt.
# --------------------------------------------------------------------------- #
manifest:
  stage: release
  image: ${GO_IMAGE}
  before_script: []
  needs:
    - build:linux-amd64
    - build:windows-amd64
    - sign:macos
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # Sortiert, damit zwei Läufe desselben Standes dasselbe Manifest ergeben.
    - cd go/dist && sha256sum *.zip | sort -k2 > "$CI_PROJECT_DIR/SHA256SUMS"
    - cat "$CI_PROJECT_DIR/SHA256SUMS"
  artifacts:
    paths:
      - SHA256SUMS
    expire_in: 1 month

upload:
  stage: release
  image: ${CURL_IMAGE}
  before_script: []
  # Ausdrücklich benannt, damit die macOS-Pakete aus sign:macos kommen und nicht
  # aus den Build-Jobs: die liefern seit der Signatur nur noch das nackte Bundle.
  needs:
    - build:linux-amd64
    - build:windows-amd64
    - sign:macos
    - manifest
    # Der Jobname der Komponente ist sign:artifact:<Datei> und nicht
    # sign-artifact. Mit dem falschen Namen zieht GitLab das Artefakt nicht,
    # der Job laeuft trotzdem gruen, und am Ende verlinkt die Release-Seite
    # eine Signatur, die nirgends liegt. optional bleibt es, weil die Komponente
    # den Job nur dort anlegt, wo Signieren ueberhaupt moeglich ist.
    - job: sign:artifact:SHA256SUMS
      optional: true
  # Nur vollständige Versions-Tags veröffentlichen. Ein Vorab-Tag wie v0.9.0-rc1
  # durchläuft damit Bauen und Signieren vollständig - mit echtem Zertifikat,
  # denn IAM erlaubt jedes v* -, legt aber kein Paket ab und erzeugt kein
  # Release. Das ist der Weg, den Signaturpfad zu prüfen, ohne dass jemand das
  # Ergebnis herunterladen kann.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # Paketversion ist der Tag, wie er ist - dieselbe Zeichenkette, die unten in
    # den Asset-Links steht. Ein hier abgeschnittenes "v" haette Links erzeugt,
    # die ins Leere zeigen.
    # Manifest und Signatur liegen im Projektverzeichnis, nicht in go/dist - sie
    # gehören zum Release und nicht zu einem Bauziel.
    #
    # Das Manifest MUSS da sein; fehlt es, ist etwas grundsätzlich schief, und
    # der Job soll das sagen statt still ein Release ohne Prüfsummen zu bauen.
    - cp "$CI_PROJECT_DIR/SHA256SUMS" go/dist/
    # Die Signatur darf fehlen - die Komponente legt ihren Job nur dort an, wo
    # Signieren möglich ist. Ob sie da war, entscheidet unten, ob die
    # Release-Seite einen Link darauf bekommt: ein Link auf eine Signatur, die
    # nirgends liegt, ist schlimmer als kein Link. Genau das ist bei v1.0.0
    # passiert.
    - |
      if cp "$CI_PROJECT_DIR/SHA256SUMS.sig" go/dist/ 2>/dev/null; then
        echo "SIGNIERT=ja" > "$CI_PROJECT_DIR/release.env"
      else
        echo "SIGNIERT=nein" > "$CI_PROJECT_DIR/release.env"
        echo "Hinweis: keine Signatur zum Manifest - das Release verlinkt keine"
      fi
    - cd go/dist
    - |
      for f in *.zip *.sha256 SHA256SUMS SHA256SUMS.sig; do
        [ -f "$f" ] || continue
        echo "lade hoch: $f"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PACKAGE_URL}/${CI_COMMIT_TAG}/${f}"
        echo
      done
  artifacts:
    reports:
      # Sagt dem release-Job, ob es eine Signatur zu verlinken gibt.
      dotenv: release.env

release:
  stage: release
  # Kein release-cli: dessen Image liegt in registry.gitlab.com, und die Runner
  # erreichen den Host nicht – sie sind IPv6-only, die Registry ist IPv4-only.
  # Genau dafür gibt es devops/ci-mirrors, aber ein weiteres Image dort zu
  # spiegeln wäre der Umweg: die Releases-API tut dasselbe, und curl ist schon da.
  image: ${CURL_IMAGE}
  before_script: []
  needs: [upload]
  # Dieselbe Schranke wie bei upload: Vorab-Tags erzeugen kein Release.
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/
  script:
    # Die Tag-Nachricht wird zur Release-Notiz.
    #
    # Frueher wurde das JSON von Hand zusammengesetzt und die Nachricht mit awk
    # und sed hineinescaped. Das ist am 2026-08-26 bei v1.2.0 gescheitert -
    # "Invalid JSON format", nachdem alles andere durchgelaufen war. Lokal baute
    # dasselbe Skript ein gueltiges Dokument; hier laeuft es im curl-Bild mit
    # busybox-awk und busybox-sed, deren Regex-Maschinen anders arbeiten.
    #
    # Statt das eine Zeichen zu suchen, ist die Fehlerklasse weg: die
    # Releases-API nimmt auch formularkodierte Daten, und --data-urlencode
    # laesst curl kodieren. Die Notiz kommt mit name@datei direkt aus einer
    # Datei - keine Anfuehrungszeichen, keine Backslashes, keine Zeilenumbrueche,
    # die jemand von Hand in \n verwandeln muss.
    - |
      # Der Signaturblock gehoert nicht auf eine Release-Seite. Bei einem
      # signierten Tag liefert GitLab ihn als Teil der Nachricht mit, und er
      # stuende sonst mitten in der Notiz.
      printf '%s\n' "${CI_COMMIT_TAG_MESSAGE:-}" \
        | sed '/-----BEGIN SSH SIGNATURE-----/,$d' > /tmp/notiz.md
      # Der feste Teil, in einem zitierten Heredoc: darin wird nichts ersetzt,
      # Backticks bleiben Backticks.
      cat >> /tmp/notiz.md <<'FUSS'

      ---

      **macOS:** ZIP entpacken, `s3mail.app` doppelklicken. Die Pakete sind mit einer Developer ID signiert und bei Apple notarisiert - kein `xattr`, kein Rechtsklick, keine Warnung.

      **Windows und Linux:** ZIP entpacken und `s3mail` ausfuehren. Unter Windows meldet sich SmartScreen mit *Weitere Informationen -> Trotzdem ausfuehren* - dort ist nicht signiert.

      Das Fenster geht von selbst auf. Die Adresse traegt ein Token, **ohne das der Server nicht antwortet**; sie steht im Terminal und in `adresse.txt` im Konfigurationsverzeichnis, falls das Fenster zugeht.

      Zu jedem Paket liegt eine `.sha256`-Datei daneben.
      FUSS
      printf '\nGebaut aus %s.\n' "${CI_COMMIT_SHA}" >> /tmp/notiz.md
    - |
      # Die Argumente sammeln, damit der signierte Anhang nur dann dazukommt,
      # wenn er auch hochgeladen wurde - siehe upload.
      set -- \
        --data-urlencode "name=s3mail ${CI_COMMIT_TAG}" \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
        --data-urlencode "description@/tmp/notiz.md"
      for datei in s3mail-windows-amd64.zip:package \
                   s3mail-macos-arm64.zip:package \
                   s3mail-macos-amd64.zip:package \
                   s3mail-linux-amd64.zip:package \
                   SHA256SUMS:other; do
        name=${datei%:*}; art=${datei#*:}
        set -- "$@" \
          --data-urlencode "assets[links][][name]=${name}" \
          --data-urlencode "assets[links][][url]=${PACKAGE_URL}/${CI_COMMIT_TAG}/${name}" \
          --data-urlencode "assets[links][][link_type]=${art}"
      done
      if [ "${SIGNIERT:-nein}" = "ja" ]; then
        set -- "$@" \
          --data-urlencode "assets[links][][name]=SHA256SUMS.sig" \
          --data-urlencode "assets[links][][url]=${PACKAGE_URL}/${CI_COMMIT_TAG}/SHA256SUMS.sig" \
          --data-urlencode "assets[links][][link_type]=other"
      fi
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "$@" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      echo
