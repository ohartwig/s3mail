# SPDX-FileCopyrightText: 2026 Kai Ole Hartwig <mail@ole-hartwig.eu>
#
# Pipeline für s3mail (Go).
#
# Alle Jobs laufen untagged und landen damit auf `aws-spot-runner` – dem
# einzigen Runner des Projekts, der untagged Jobs annimmt (Docker, Linux/arm64).
# Die anderen verlangen ihre eigenen Tags und sind für Signing- und apk-Arbeit
# reserviert.
#
# Dass der Runner arm64 ist, spielt keine Rolle: Go kompiliert von dort für alle
# Zielplattformen, weil nichts in der Abhängigkeitskette CGO braucht. Genau
# deshalb ist das Projekt von Python nach Go gewandert – PyInstaller konnte
# grundsätzlich nur für die Plattform bauen, auf der es lief, und ein
# Windows-Paket war damit gar nicht herstellbar.
#
# Der Katalog unter devops/ci-cd-components ist PHP/TYPO3-seitig, für Go gibt es
# dort nichts – deshalb hier von Hand.

stages:
  - test
  - build
  - release

variables:
  # Beide Images aus unserem Mirror, nicht von Docker Hub – siehe
  # okf://core/engineering/ci-image-access.md und die Katalog-Konvention in
  # devops/ci-cd-components. `development/s3mail` steht auf der
  # Job-Token-Allowlist von devops/ci-mirrors; ohne die kämen bot-getriggerte
  # Pipelines nicht an die Images, während von Hand angestoßene noch liefen.
  GO_IMAGE: "registry.ole-hartwig.eu/devops/ci-mirrors/golang:1.25"
  CURL_IMAGE: "registry.ole-hartwig.eu/devops/ci-mirrors/curl:8.19.0-dev"
  # Nicht heimlich eine andere Go-Version ziehen: was im Image ist, gilt.
  GOTOOLCHAIN: "local"
  GOFLAGS: "-mod=readonly"
  GOPATH: "${CI_PROJECT_DIR}/.go"
  PAKET_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/s3mail"

default:
  image: ${GO_IMAGE}
  # Die Flotte besteht aus Spot-Instanzen: eine kann mitten im Job zurückgezogen
  # werden, und der Job stirbt dann mit "instance no longer running". Das ist
  # kein Fehler im Gebauten – beim ersten v0.2.1-Lauf traf es zwei von vier
  # Build-Jobs, während die anderen beiden auf demselben Commit durchliefen.
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - scheduler_failure
  before_script:
    - cd go
  cache:
    key:
      files:
        - go/go.sum
    paths:
      - .go/pkg/mod

# --------------------------------------------------------------------------- #
# Test
# --------------------------------------------------------------------------- #
test:
  stage: test
  script:
    - test -z "$(gofmt -l .)" || { echo "nicht formatiert:"; gofmt -l .; exit 1; }
    - go vet ./...
    - go test -race -coverprofile=coverage.out ./...
    - go tool cover -func=coverage.out | tail -1
  coverage: '/total:\s+\(statements\)\s+(\d+\.\d+)%/'
  artifacts:
    paths:
      - go/coverage.out
    expire_in: 1 week

# --------------------------------------------------------------------------- #
# Bauen – vier Plattformen aus einem Lauf
# --------------------------------------------------------------------------- #
.build:
  stage: build
  needs: [test]
  script:
    # -trimpath nimmt die Pfade des Baurechners aus dem Binary, damit zwei Läufe
    # dasselbe Ergebnis liefern.
    - VERSION="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - mkdir -p dist
    # LDFLAGS trägt bei Windows zusätzlich -H windowsgui: sonst reißt der
    # Doppelklick ein Konsolenfenster auf, dessen Schließen den Server killt.
    - |
      CGO_ENABLED=0 GOOS="$ZIEL_OS" GOARCH="$ZIEL_ARCH" \
        go build -trimpath -ldflags="-s -w -X main.version=${VERSION} ${EXTRA_LDFLAGS:-}" \
        -o "dist/${DATEI}" ./cmd/s3mail
    # macOS bekommt ein App-Bundle statt einer nackten Unix-Datei. Ein Bundle ist
    # nur eine Verzeichnisstruktur mit einer Info.plist – das entsteht auch auf
    # Linux, ohne Apple-Werkzeug und ohne den Mac, den die Portierung losgeworden ist.
    - |
      if [ "$ZIEL_OS" = "darwin" ]; then
        tools/bundle/bauen.sh "dist/${DATEI}" dist "${VERSION}"
        rm "dist/${DATEI}"
        PAKETINHALT="dist/s3mail.app"
      else
        PAKETINHALT="dist/${DATEI}"
      fi
      go run tools/zip.go "dist/s3mail-${LABEL}.zip" "$PAKETINHALT"
      rm -rf "$PAKETINHALT"
    # Als ZIP, damit Ausführungs-Bit und Bundle-Struktur den Download überstehen –
    # eine roh heruntergeladene Datei kommt ohne +x an und startet nicht.
    # Gepackt wird mit Go, nicht mit /usr/bin/zip: das golang-Image bringt es
    # nicht mit, und ein apt-get dafür wäre ein zweiter Paketkanal in einer
    # Pipeline, die sonst nur Go braucht.
    - cd dist && sha256sum "s3mail-${LABEL}.zip" > "s3mail-${LABEL}.zip.sha256"
  artifacts:
    paths:
      - go/dist/
    expire_in: 1 month

build:windows-amd64:
  extends: .build
  variables: { ZIEL_OS: windows, ZIEL_ARCH: amd64, LABEL: windows-amd64, DATEI: s3mail.exe,
               EXTRA_LDFLAGS: "-H windowsgui" }

build:macos-arm64:
  extends: .build
  variables: { ZIEL_OS: darwin, ZIEL_ARCH: arm64, LABEL: macos-arm64, DATEI: s3mail }

build:macos-amd64:
  extends: .build
  variables: { ZIEL_OS: darwin, ZIEL_ARCH: amd64, LABEL: macos-amd64, DATEI: s3mail }

build:linux-amd64:
  extends: .build
  variables: { ZIEL_OS: linux, ZIEL_ARCH: amd64, LABEL: linux-amd64, DATEI: s3mail }

# --------------------------------------------------------------------------- #
# Veröffentlichen – nur auf einem Tag
# --------------------------------------------------------------------------- #
upload:
  stage: release
  image: ${CURL_IMAGE}
  before_script: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    # Paketversion ist der Tag, wie er ist - dieselbe Zeichenkette, die unten in
    # den Asset-Links steht. Ein hier abgeschnittenes "v" haette Links erzeugt,
    # die ins Leere zeigen.
    - cd go/dist
    - |
      for f in *.zip *.sha256; do
        echo "lade hoch: $f"
        curl --fail-with-body --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$f" "${PAKET_URL}/${CI_COMMIT_TAG}/${f}"
        echo
      done

release:
  stage: release
  # Kein release-cli: dessen Image liegt in registry.gitlab.com, und die Runner
  # erreichen den Host nicht – sie sind IPv6-only, die Registry ist IPv4-only.
  # Genau dafür gibt es devops/ci-mirrors, aber ein weiteres Image dort zu
  # spiegeln wäre der Umweg: die Releases-API tut dasselbe, und curl ist schon da.
  image: ${CURL_IMAGE}
  before_script: []
  needs: [upload]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      cat > /tmp/release.json <<EOF
      {
        "name": "s3mail ${CI_COMMIT_TAG}",
        "tag_name": "${CI_COMMIT_TAG}",
        "description": "Gebaut aus ${CI_COMMIT_SHA}.\n\n**Starten:** ZIP entpacken und \`s3mail\` ausführen. Auf macOS blockt Gatekeeper das unsignierte Programm beim ersten Mal – einmal \`xattr -dr com.apple.quarantine s3mail\` genügt; unter Windows meldet sich SmartScreen mit *Weitere Informationen → Trotzdem ausführen*.\n\nDanach steht im Terminal eine Adresse mit Token; **ohne die antwortet der Server nicht.** Sie steht außerdem in \`adresse.txt\` im Konfigurationsverzeichnis, falls das Fenster zugeht.\n\nZu jedem Paket liegt eine \`.sha256\`-Datei daneben.",
        "assets": {
          "links": [
            {"name": "s3mail-windows-amd64.zip", "url": "${PAKET_URL}/${CI_COMMIT_TAG}/s3mail-windows-amd64.zip", "link_type": "package"},
            {"name": "s3mail-macos-arm64.zip (Apple Silicon)", "url": "${PAKET_URL}/${CI_COMMIT_TAG}/s3mail-macos-arm64.zip", "link_type": "package"},
            {"name": "s3mail-macos-amd64.zip (Intel)", "url": "${PAKET_URL}/${CI_COMMIT_TAG}/s3mail-macos-amd64.zip", "link_type": "package"},
            {"name": "s3mail-linux-amd64.zip", "url": "${PAKET_URL}/${CI_COMMIT_TAG}/s3mail-linux-amd64.zip", "link_type": "package"}
          ]
        }
      }
      EOF
    - |
      curl --fail-with-body --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --header "Content-Type: application/json" \
        --data @/tmp/release.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases"
      echo
